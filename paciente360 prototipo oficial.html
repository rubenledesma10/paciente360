function TextField({ slotProps, ...p }) {
  const extra = {};
  if (slotProps?.input) extra.InputProps = slotProps.input;
  if (slotProps?.inputLabel) extra.InputLabelProps = slotProps.inputLabel;
  if (slotProps?.htmlInput) extra.inputProps = { ...(p.inputProps || {}), ...slotProps.htmlInput };
  if (slotProps?.textField) Object.assign(extra, slotProps.textField);
  return <MuiTextField {...p} {...extra} />;
}
function Grid({ size, container, ...p }) {
  if (container) return <MuiGrid container {...p} />;
  return <MuiGrid item {...(size || {})} {...p} />;
}
function DatePicker({ label, value, onChange, slotProps }) {
  return (
    <TextField
      type="date"
      label={label}
      size={slotProps?.textField?.size || 'medium'}
      value={value || ''}
      onChange={(e) => onChange(e.target.value || null)}
      slotProps={{ inputLabel: { shrink: true } }}
    />
  );
}
function DateTimePicker({ label, value, onChange, disabled, slotProps }) {
  return (
    <TextField
      type="datetime-local"
      label={label}
      value={value || ''}
      disabled={disabled}
      onChange={(e) => onChange(e.target.value || null)}
      slotProps={{ inputLabel: { shrink: true } }}
      error={slotProps?.textField?.error}
      helperText={slotProps?.textField?.helperText}
    />
  );
}

// ---------- Utilidades de fecha (reemplazan dayjs) ----------
const pad2 = (n) => String(n).padStart(2, '0');
const toYMD = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => toYMD(new Date());
const addDays = (n, base) => { const d = base ? parseDate(base) : new Date(); d.setDate(d.getDate() + n); return toYMD(d); };
const parseDate = (value) => {
  if (!value) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) { const [y, m, d] = value.split('-').map(Number); return new Date(y, m - 1, d); }
  const d = new Date(value); return Number.isNaN(d.getTime()) ? null : d;
};
const formatDate = (value) => { const d = parseDate(value); return d ? `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}` : '—'; };
const formatDateTime = (value) => { const d = parseDate(value); return d ? `${formatDate(value)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : '—'; };
const formatDateLong = (value) => { const d = parseDate(value); return d ? d.toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' }) : ''; };
const isoAgo = ({ days = 0, hours = 0, minutes = 0 } = {}) => { const d = new Date(); d.setDate(d.getDate() - days); d.setHours(d.getHours() - hours, d.getMinutes() - minutes); return d.toISOString(); };
const isoAt = (ymd, hhmm) => { const d = parseDate(ymd); const [h, m] = (hhmm || '00:00').split(':').map(Number); d.setHours(h, m, 0, 0); return d.toISOString(); };
const nowIso = () => new Date().toISOString();
const daysUntil = (value) => { const t = parseDate(value); if (!t) return null; const today = new Date(); today.setHours(0, 0, 0, 0); t.setHours(0, 0, 0, 0); return Math.round((t - today) / 86400000); };
const minutesSince = (iso) => (Date.now() - new Date(iso).getTime()) / 60000;
const hoursUntil = (ymd, hhmm) => (new Date(isoAt(ymd, hhmm)).getTime() - Date.now()) / 3600000;
const sameDay = (iso, ymd) => { const d = parseDate(iso); return d && toYMD(d) === ymd; };
const getPatientAge = (dob) => { const d = parseDate(dob); if (!d) return null; const t = new Date(); let a = t.getFullYear() - d.getFullYear(); const m = t.getMonth() - d.getMonth(); if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--; return a; };
const getPatientDni = (p) => p?.dni || '—';
const formatPatientLabel = (p) => { if (!p) return '—'; const age = getPatientAge(p.date_of_birth); return `${p.first_name} ${p.last_name} — DNI ${getPatientDni(p)}${age != null ? ` — ${age} años` : ''}`; };
const fullName = (u) => (u ? `${u.first_name} ${u.last_name}` : '—');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const RouterLink = React.forwardRef(function RouterLink({ to, children, onClick, ...p }, ref) {
  const navigate = useNavigate();

    <a ref={ref} href={'#' + to} onClick={(e) => { e.preventDefault(); onClick && onClick(e); navigate(to); }} {...p}>

// Helpers de "API" sobre el estado en memoria
function makeApi(db, setDb) {
  const patients = () => db.users.filter((u) => u.rol === 'Patient');
  const doctors = () => db.users.filter((u) => u.rol === 'Doctor');
  const nurses = () => db.users.filter((u) => u.rol === 'Nurse');
  const user = (id) => db.users.find((u) => u.id_user === id);
  const name = (id) => fullName(user(id));
  const spec = (id) => SPECIALTIES.find((s) => s.id_speciality === id)?.name || '—';
  const product = (id) => db.products.find((p) => p.id_product === id);
  const withNames = (a) => ({ ...a, patient_name: name(a.id_patient), doctor_name: name(a.id_doctor), patient_can_confirm: isOpenStatus(a.status) && !a.confirmed && (() => { const h = hoursUntil(a.date, a.hour); return h > 0 && h <= CONFIRM_WINDOW_DAYS * 24; })(), patient_can_cancel: isOpenStatus(a.status) });
  const fuStatus = (f) => { if (f.finish) return 'finished'; if (!f.next_check_up) return 'scheduled'; const d = daysUntil(f.next_check_up); if (d === 0) return 'active'; if (d < 0) return 'pending'; return 'scheduled'; };
  const followUpsFull = () => db.followUps.map((f) => ({ ...f, status: fuStatus(f), patient_name: name(f.id_patient), nurse_name: name(f.id_nurse) }));
  const update = (fn) => setDb((prev) => { const next = { ...prev, seq: { ...prev.seq } }; fn(next); return next; });
  const log = (next, username, action, table_name, record_id, details) => { next.bitacora = [{ id_bitacora: ++next.seq.bit, timestamp: nowIso(), username, action, table_name, record_id, details }, ...next.bitacora]; };
  // Pacientes atendidos o en espera (hoy): los que puede cargar enfermería
  const patientsByStatus = () => { const ids = new Set(db.appointments.filter((a) => a.date === todayStr() && (a.status === 'Atendido' || a.status === 'En espera')).map((a) => a.id_patient)); return patients().filter((p) => ids.has(p.id_user)); };
  const attendedToday = () => db.appointments.filter((a) => a.date === todayStr() && a.status === 'Atendido').map((a) => ({ ...user(a.id_patient), attended_by: name(a.id_doctor) })).filter((v, i, arr) => arr.findIndex((x) => x.id_user === v.id_user) === i);
  const medicalHistory = (pid) => [
    ...db.signs.filter((s) => s.id_patient === pid).map((s) => ({ tipo: 'Signos y Síntomas', id: s.id_signs_and_symptoms, fecha: s.date_and_time, detalle: s })),
    ...db.followUps.filter((f) => f.id_patient === pid).map((f) => ({ tipo: 'Seguimiento', id: f.id_follow_up, fecha: f.date_time, detalle: f })),
    ...db.indications.filter((i) => i.id_patient === pid).map((i) => ({ tipo: 'Indicación Médica', id: i.id_medical_indication, fecha: i.created_at, id_doctor: i.id_doctor, detalle: i })),
  ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const slotsGrid = (doctorId, date) => {
    const taken = db.appointments.filter((a) => a.id_doctor === doctorId && a.date === date && isOpenStatus(a.status)).map((a) => a.hour);
    const out = [];
    for (let m = OPENING_HOUR * 60; m < CLOSING_HOUR * 60; m += APPOINTMENT_MINUTES) {
      const hour = `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
      const past = date === todayStr() && hoursUntil(date, hour) <= 0;
      const isTaken = taken.some((t) => Math.abs(toMinutes(t) - toMinutes(hour)) < APPOINTMENT_MINUTES);
      out.push({ hour, status: past ? 'past' : isTaken ? 'taken' : 'available' });
    }
    return out;
  };
  const productFlags = (p) => { const d = daysUntil(p.expiration_date); const vencido = d != null && d < 0; return { ...p, vencido, por_vencer: !vencido && d != null && d <= DIAS_POR_VENCER }; };
  return { db, patients, doctors, nurses, user, name, spec, product, withNames, followUpsFull, update, log, patientsByStatus, attendedToday, medicalHistory, slotsGrid, productFlags };
}
const isOpenStatus = (s) => s === 'Reservado' || s === 'En espera';
const toMinutes = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };

        .sort((a, b) => parseDate(a.date) - parseDate(b.date)).map((a) => { const d = daysUntil(a.date); return { id: `ap-${a.id_medical_appointment}`, title: `Turno con ${api.name(a.id_patient)}`, subtitle: d === 0 ? `Hoy a las ${a.hour}` : `${fmtDM(a.date)} a las ${a.hour}`, to: '/agenda' }; });

        .sort((a, b) => parseDate(a.date) - parseDate(b.date)).map((a) => {
          const d = daysUntil(a.date); const needsConfirm = !a.confirmed && d > 0 && d <= CONFIRM_WINDOW_DAYS; const doctor = api.name(a.id_doctor);
          return { id: `ap-${a.id_medical_appointment}`, title: needsConfirm ? `Confirmá tu turno del ${fmtDM(a.date)}` : `Turno el ${fmtDM(a.date)}`, subtitle: needsConfirm ? `Con ${doctor} a las ${a.hour}` : `Con ${doctor} a las ${a.hour}${a.confirmed ? ' (confirmado)' : ''}`, to: '/mis-turnos' };
        });
    }
    return [];
  }, [rol, userId, api.db]);

  const signature = (n) => `${n.id}|${n.title}|${n.subtitle}`;
  const unreadCount = items.filter((n) => !seen.has(signature(n))).length;
  const open = Boolean(anchorEl);
  const handleOpen = (e) => { setAnchorEl(e.currentTarget); setSeen(new Set(items.map(signature))); };
  const handleClose = () => setAnchorEl(null);
  const handleClickItem = (n) => { handleClose(); navigate(n.to); };

  return (
    <>
      <IconButton onClick={handleOpen}>
        <Badge badgeContent={unreadCount} color="error">

      <Popover open={open} anchorEl={anchorEl} onClose={handleClose} anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }} transformOrigin={{ vertical: 'top', horizontal: 'right' }}>
        <Box sx={{ width: 320, maxHeight: 400 }}>

function aiPatientSummary(api, patientId) {
  const p = api.user(patientId);
  const consultas = api.db.appointments.filter((a) => a.id_patient === patientId && a.status === 'Atendido');
  const signos = api.db.signs.filter((s) => s.id_patient === patientId).sort((a, b) => new Date(b.date_and_time) - new Date(a.date_and_time));
  const segs = api.followUpsFull().filter((f) => f.id_patient === patientId);
  const inds = api.db.indications.filter((i) => i.id_patient === patientId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const lines = [];
  lines.push('Paciente');
  lines.push(`- ${fullName(p)}, ${getPatientAge(p.date_of_birth)} años, DNI ${p.dni}. Cobertura: ${p.health_plan_name || 'particular'}.${p.allergies ? ` Alergias registradas: ${p.allergies}.` : ''}`);
  lines.push('');
  lines.push('Antecedentes en el sistema');
  if (consultas.length) consultas.slice(-3).forEach((c) => lines.push(`- ${formatDate(c.date)}: ${c.reason}${c.diagnosis ? ` → ${c.diagnosis}` : ' (sin diagnóstico cargado)'}`)); else lines.push('- Sin consultas previas registradas.');
  lines.push('');
  lines.push('Últimos signos vitales');
  if (signos[0]) lines.push(`- ${formatDateTime(signos[0].date_and_time)}: temp ${signos[0].temperature}°C, presión ${signos[0].blood_pressure}. Síntomas: ${signos[0].symptoms}.`); else lines.push('- Sin registros de enfermería.');
  lines.push('');
  lines.push('Seguimiento de enfermería');
  if (segs.length) segs.slice(0, 2).forEach((s) => lines.push(`- ${s.observations} (${({ active: 'control hoy', pending: 'control vencido', scheduled: 'programado', finished: 'finalizado' })[s.status]})`)); else lines.push('- Sin seguimientos.');
  lines.push('');
  lines.push('Indicaciones registradas');
  if (inds.length) inds.slice(0, 3).forEach((i) => lines.push(`- ${i.indication}${i.treatment ? ` · ${i.treatment}` : ''}`)); else lines.push('- Sin indicaciones.');
  lines.push('');
  lines.push('Puntos a tener en cuenta');
  const pts = [];
  if (signos[0] && signos[0].temperature >= 38) pts.push('Registra fiebre en el último control de enfermería.');
  if (p.allergies) pts.push(`Verificar alergias antes de indicar medicación (${p.allergies}).`);
  if (consultas.some((c) => c.disease_type === 'Cardiovascular')) pts.push('Antecedente cardiovascular reiterado: revisar adherencia al tratamiento.');
  if (segs.some((s) => s.status === 'pending')) pts.push('Tiene un seguimiento de enfermería vencido.');
  if (!pts.length) pts.push('Sin alertas particulares según los registros disponibles.');
  pts.forEach((x) => lines.push(`- ${x}`));
  return { summary: lines.join('\n'), registros: { consultas: consultas.length, signos: signos.length, seguimientos: segs.length, indicaciones: inds.length } };
}

  useEffect(() => { if (open) endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading, open]);

    const q = (text ?? question).trim();
    if (!q || loading) return;
    setError(''); setQuestion('');
    setMessages((prev) => [...prev, { role: 'user', text: q }]);
    setLoading(true);
    try { const a = await aiHelp(q); setMessages((prev) => [...prev, { role: 'assistant', text: a }]); } catch { setError('No se pudo responder. Probá de nuevo.'); } finally { setLoading(false); }
  };
  return (
    <>
      {!open && (
        <Tooltip title="Asistente virtual" placement="left">

            <SmartToyIcon fontSize="small" />
            <Box sx={{ flexGrow: 1 }}>

              <Typography variant="caption" sx={{ opacity: 0.85 }}>Te ayudo a usar Paciente360</Typography>
            </Box>
            <IconButton size="small" onClick={() => setOpen(false)} sx={{ color: '#fff' }}><CloseIcon fontSize="small" /></IconButton>
          </Box>
          <Box sx={{ flexGrow: 1, overflowY: 'auto', p: 2, bgcolor: '#f8fafc' }}>
            {messages.length === 0 && (
              <Box>
                <Typography variant="body2" color="#5b7387" sx={{ mb: 1.5 }}>Puedo explicarte dónde está cada cosa y cómo funciona. Por ejemplo:</Typography>
                <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
                  {SUGERENCIAS.map((s) => <Button key={s} size="small" variant="outlined" onClick={() => send(s)} sx={{ justifyContent: 'flex-start', textTransform: 'none' }}>{s}</Button>)}
                </Box>
              </Box>
            )}
            {messages.map((m, i) => {
              const esUsuario = m.role === 'user';
              return (
                <Box key={i} sx={{ display: 'flex', gap: 1, mb: 1.5, flexDirection: esUsuario ? 'row-reverse' : 'row' }}>
                  {!esUsuario && <Avatar sx={{ width: 26, height: 26, bgcolor: '#29ABE2' }}><SmartToyIcon sx={{ fontSize: 14 }} /></Avatar>}
                  <Box sx={{ maxWidth: '85%', p: 1.25, borderRadius: 2, bgcolor: esUsuario ? '#0E4C82' : '#fff', border: esUsuario ? 'none' : '1px solid #e2e8f0' }}>
                    {esUsuario ? <Typography variant="body2" sx={{ color: '#fff' }}>{m.text}</Typography> : <TextoFormateado text={m.text} />}
                  </Box>
                </Box>
              );
            })}
            {loading && <Box sx={{ display: 'flex', gap: 1, alignItems: 'center' }}><Avatar sx={{ width: 26, height: 26, bgcolor: '#29ABE2' }}><SmartToyIcon sx={{ fontSize: 14 }} /></Avatar><CircularProgress size={16} /></Box>}
            {error && <Alert severity="warning" sx={{ mt: 1 }} onClose={() => setError('')}>{error}</Alert>}
            <div ref={endRef} />
          </Box>
          <Box sx={{ p: 1.5, borderTop: '1px solid #e2e8f0', display: 'flex', gap: 1 }}>
            <TextField fullWidth size="small" placeholder="Escribí tu pregunta" value={question} onChange={(e) => setQuestion(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} slotProps={{ htmlInput: { maxLength: 400 } }} disabled={loading} autoFocus />
            <Button variant="contained" onClick={() => send()} disabled={loading || !question.trim()} sx={{ minWidth: 40, px: 1.5 }}><SendIcon fontSize="small" /></Button>
          </Box>
          <Typography variant="caption" color="#5b7387" sx={{ px: 2, pb: 1.5, textAlign: 'center' }}>Solo explica cómo usar la app. Para consultas de salud, sacá un turno.</Typography>
        </Paper>
      )}
    </>

}

  return (

  );
}

// ---------- Historial de indicaciones (components/IndicationsHistoryDialog.jsx) ----------
const UNLINKED_KEY = 'sin-turno';
function IndicationsHistoryDialog({ open, onClose, patientId, patientName, patientDni, patientAge }) {
  const api = useDb();
  const [order, setOrder] = useState('desc');
  const groups = useMemo(() => {
    if (!open || !patientId) return [];
    const rows = api.db.indications.filter((i) => i.id_patient === patientId).map((i) => ({ ...i, doctor_name: api.name(i.id_doctor) }));
    const map = new Map();
    rows.forEach((r) => {
      const key = r.id_medical_appointment ? `ap-${r.id_medical_appointment}` : UNLINKED_KEY;
      if (!map.has(key)) { const apx = api.db.appointments.find((a) => a.id_medical_appointment === r.id_medical_appointment); map.set(key, { key, appointmentDate: apx?.date, appointmentReason: apx?.reason, items: [] }); }
      map.get(key).items.push(r);
    });
    const sign = order === 'desc' ? -1 : 1;
    const gs = [...map.values()];
    gs.forEach((g) => g.items.sort((a, b) => sign * (new Date(a.created_at) - new Date(b.created_at))));
    gs.sort((a, b) => sign * (new Date(a.items[0].created_at) - new Date(b.items[0].created_at)));
    return gs;
  }, [open, patientId, order, api.db]);
  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="sm">
      <DialogTitle sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Box>
          <Typography variant="h6" fontWeight={800} color={paletteRaw.azulD}>Historial de indicaciones</Typography>
          <Typography variant="caption" color={paletteRaw.gray}>{patientName}{patientDni && ` — DNI ${patientDni}`}{patientAge != null && ` — ${patientAge} años`}</Typography>
        </Box>
        <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
          <Tooltip title={order === 'desc' ? 'Más antigua primero' : 'Más reciente primero'}><IconButton size="small" onClick={() => setOrder((o) => (o === 'asc' ? 'desc' : 'asc'))}><SwapVertIcon fontSize="small" /></IconButton></Tooltip>
          <IconButton onClick={onClose} size="small"><CloseIcon /></IconButton>
        </Box>
      </DialogTitle>
      <DialogContent dividers>
        {groups.length === 0 && <Typography color={paletteRaw.gray}>Este paciente todavía no tiene indicaciones registradas.</Typography>}
        {groups.map((group) => (
          <Accordion key={group.key} defaultExpanded>
            <AccordionSummary expandIcon={<ExpandMoreIcon />}>
              <Typography fontWeight={700} color={paletteRaw.azulD}>{group.key === UNLINKED_KEY ? 'Sin turno asociado' : `Atención del ${formatDate(group.appointmentDate)}${group.appointmentReason ? ` — ${group.appointmentReason}` : ''}`}</Typography>
            </AccordionSummary>
            <AccordionDetails>
              {group.items.map((r, index) => (
                <Box key={r.id_medical_indication} sx={{ mb: index < group.items.length - 1 ? 2 : 0 }}>
                  <Typography variant="caption" color={paletteRaw.gray}>{formatDateTime(r.created_at)} — {r.doctor_name || '—'}</Typography>
                  <Typography variant="body2" color={paletteRaw.ink}>{r.indication}</Typography>
                  {r.treatment && <Typography variant="caption" color={paletteRaw.gray}>Tratamiento: {r.treatment}</Typography>}
                </Box>
              ))}
            </AccordionDetails>
          </Accordion>
        ))}
      </DialogContent>
    </Dialog>
  );
}

// ---------- "PDF" en el prototipo ----------
function downloadText(filename, lines) {
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Registro de paciente (pages/RegisterPage.jsx) ----------
function RegisterPage() {
  const api = useDb();

  const [showPassword, setShowPassword] = useState(false);
  const [showConfirmPassword, setShowConfirmPassword] = useState(false);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const onSubmit = async (e) => {
    e.preventDefault();
    const errs = {};
    if (!f.first_name) errs.first_name = 'Ingresá tu nombre';
    if (!f.last_name) errs.last_name = 'Ingresá tu apellido';
    if (!/^\d{7,8}$/.test(f.dni)) errs.dni = 'Ingresá un DNI válido';
    if (!f.date_of_birth) errs.date_of_birth = 'Ingresá tu fecha de nacimiento';
    if (!/^\S+@\S+\.\S+$/.test(f.email)) errs.email = 'Ingresá un email válido';
    if (!f.username) errs.username = 'Elegí un usuario';
    if (f.password.length < 6) errs.password = 'Mínimo 6 caracteres';
    if (f.confirmPassword !== f.password) errs.confirmPassword = 'Las contraseñas no coinciden';
    setErrors(errs);
    if (Object.keys(errs).length) return;
    setIsSubmitting(true); setServerError('');
    await sleep(500);
    if (api.db.users.some((u) => u.username === f.username || u.dni === f.dni)) { setServerError('Ya existe un usuario con ese DNI o nombre de usuario.'); setIsSubmitting(false); return; }
    api.update((n) => { const id = ++n.seq.user; n.users = [...n.users, { id_user: id, is_active: true, rol: 'Patient', photo: null, country: 'Argentina', emergency_contact: '', ...f, gender: f.gender === 'F' ? 'Femenino' : f.gender === 'M' ? 'Masculino' : f.gender }]; api.log(n, f.username, 'CREAR', 'patients', id, 'Registro creado en la tabla patients (autoregistro)'); });

        </Box>
        <Paper sx={{ p: 4 }}>
          <Box component="form" onSubmit={onSubmit} noValidate>
            {serverError && <Alert severity="error" sx={{ mb: 2 }}>{serverError}</Alert>}
            <Typography variant="subtitle2" fontWeight={700} color={paletteRaw.azulD} sx={{ mt: 1, mb: 1 }}>Datos personales</Typography>
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField label="Nombre" fullWidth margin="dense" value={f.first_name} onChange={set('first_name')} error={!!errors.first_name} helperText={errors.first_name} />
              <TextField label="Apellido" fullWidth margin="dense" value={f.last_name} onChange={set('last_name')} error={!!errors.last_name} helperText={errors.last_name} />

              <TextField label="Fecha de nacimiento" type="date" fullWidth margin="dense" slotProps={{ inputLabel: { shrink: true } }} value={f.date_of_birth} onChange={set('date_of_birth')} error={!!errors.date_of_birth} helperText={errors.date_of_birth} />
            </Box>
            <TextField select label="Género" fullWidth margin="dense" value={f.gender} onChange={set('gender')}>
              <MenuItem value="">Prefiero no decir</MenuItem><MenuItem value="F">Femenino</MenuItem><MenuItem value="M">Masculino</MenuItem><MenuItem value="Otro">Otro</MenuItem>
            </TextField>
            <Typography variant="subtitle2" fontWeight={700} color={paletteRaw.azulD} sx={{ mt: 2, mb: 1 }}>Contacto</Typography>
            <TextField label="Email" fullWidth margin="dense" value={f.email} onChange={set('email')} error={!!errors.email} helperText={errors.email} />

            {f.health_plan_status && (
              <Box sx={{ display: 'flex', gap: 2 }}>
                <TextField label="Obra social" fullWidth margin="dense" value={f.health_plan_name} onChange={set('health_plan_name')} />
                <TextField label="N° de afiliado" fullWidth margin="dense" value={f.member_number} onChange={set('member_number')} />
              </Box>

            <Typography variant="subtitle2" fontWeight={700} color={paletteRaw.azulD} sx={{ mt: 2, mb: 1 }}>Acceso</Typography>
            <TextField label="Usuario" fullWidth margin="dense" value={f.username} onChange={set('username')} error={!!errors.username} helperText={errors.username} />
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField label="Contraseña" type={showPassword ? 'text' : 'password'} fullWidth margin="dense" value={f.password} onChange={set('password')} error={!!errors.password} helperText={errors.password}
                slotProps={{ input: { endAdornment: (<InputAdornment position="end"><IconButton onClick={() => setShowPassword((v) => !v)} edge="end" size="small">{showPassword ? <VisibilityOff /> : <Visibility />}</IconButton></InputAdornment>) } }} />
              <TextField label="Confirmar contraseña" type={showConfirmPassword ? 'text' : 'password'} fullWidth margin="dense" value={f.confirmPassword} onChange={set('confirmPassword')} error={!!errors.confirmPassword} helperText={errors.confirmPassword}
                slotProps={{ input: { endAdornment: (<InputAdornment position="end"><IconButton onClick={() => setShowConfirmPassword((v) => !v)} edge="end" size="small">{showConfirmPassword ? <VisibilityOff /> : <Visibility />}</IconButton></InputAdornment>) } }} />
            </Box>
            <Button type="submit" variant="contained" size="large" fullWidth disabled={isSubmitting} sx={{ mt: 3 }}>{isSubmitting ? 'Creando cuenta…' : 'Crear cuenta'}</Button>
            <Button variant="contained" size="large" fullWidth onClick={() => navigate('/')} sx={{ mt: 1.5 }}>Volver</Button>
            <Typography variant="body2" align="center" sx={{ mt: 2 }} color={paletteRaw.gray}>¿Ya tenés cuenta?{' '}<Link component={RouterLink} to="/">Iniciar sesión</Link></Typography>
          </Box>
        </Paper>
      </Box>
    </Box>
  );
}

// ---------- Paso numerado del flujo de turnos ----------
function StepTitle({ number, children }) {
  return (
    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, mb: 1.5 }}>
      <Avatar sx={{ width: 26, height: 26, fontSize: 14, fontWeight: 700, bgcolor: '#0E4C82' }}>{number}</Avatar>
      <Typography fontWeight={700} color="#0E4C82">{children}</Typography>
    </Box>
  );
}
function DoctorPicker({ doctors, doctor, onPick }) {
  return (
    <Box sx={{ display: 'flex', gap: 1.5, flexWrap: 'wrap' }}>
      {doctors.map((d) => {
        const selected = doctor?.id_user === d.id_user;
        return (
          <Card key={d.id_user} onClick={() => onPick(d)} sx={{ p: 1.5, minWidth: 230, cursor: 'pointer', border: '2px solid', borderColor: selected ? '#29ABE2' : 'transparent', bgcolor: selected ? '#f0f9fe' : '#fff', display: 'flex', alignItems: 'center', gap: 1.5 }}>
            <Avatar sx={{ bgcolor: '#29ABE2', fontWeight: 700 }}>{d.first_name?.charAt(0)}</Avatar>
            <Box>
              <Typography fontWeight={700} color="#0E4C82">{d.first_name} {d.last_name}</Typography>
              <Typography variant="caption" color="#5b7387">{d.health_plans?.length ? d.health_plans.join(', ') : 'Consultar obras sociales'}</Typography>
            </Box>
          </Card>
        );
      })}
    </Box>
  );
}
function SlotGrid({ displayGrid, hour, setHour, conflictTitle }) {
  return (
    <Box sx={{ display: 'flex', gap: 1, flexWrap: 'wrap' }}>
      {displayGrid.map((slot) => {
        const isTaken = slot.status === 'taken';
        const blocked = isTaken || Boolean(slot.conflict);
        let title = '';
        if (isTaken) title = 'Ese horario ya está reservado'; else if (slot.conflict) title = conflictTitle(slot.conflict);
        return (
          <Tooltip key={slot.hour} title={title} disableHoverListener={!blocked}>
            <span>
              <Chip label={slot.hour} disabled={blocked} onClick={blocked ? undefined : () => setHour(slot.hour)} color={hour === slot.hour ? 'primary' : slot.conflict ? 'warning' : 'default'} variant={hour === slot.hour ? 'filled' : 'outlined'} sx={{ fontWeight: 600, textDecoration: isTaken ? 'line-through' : 'none' }} />
            </span>
          </Tooltip>
        );
      })}
    </Box>
  );
}

// ---------- Sacar turno sin cuenta (pages/SacarTurnoPublicoPage.jsx) ----------
function SacarTurnoPublicoPage() {
  const api = useDb();
  const today = todayStr();
  const [form, setForm] = useState({ dni: '', date_of_birth: '', first_name: '', last_name: '', email: '', phone_number: '' });
  const [specialtyId, setSpecialtyId] = useState('');
  const [doctor, setDoctor] = useState(null);
  const [date, setDate] = useState('');
  const [hour, setHour] = useState('');
  const [reason, setReason] = useState('');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [booked, setBooked] = useState(null);
  const doctors = specialtyId ? api.doctors().filter((d) => d.id_especialidad === Number(specialtyId)) : [];
  const grid = doctor && date ? api.slotsGrid(doctor.id_user, date).filter((g) => g.status !== 'past') : [];
  const known = api.patients().find((p) => p.dni === form.dni.trim() && p.date_of_birth === form.date_of_birth);
  const busyHours = known && date ? api.db.appointments.filter((a) => a.id_patient === known.id_user && a.date === date && isOpenStatus(a.status)).map((a) => a.hour) : [];
  const displayGrid = grid.map((slot) => ({ ...slot, conflict: slot.status === 'taken' ? null : busyHours.some((h) => Math.abs(toMinutes(h) - toMinutes(slot.hour)) < APPOINTMENT_MINUTES) ? true : null }));
  const freeCount = displayGrid.filter((g) => g.status === 'available' && !g.conflict).length;
  const handleSpecialtyChange = (v) => { setSpecialtyId(v); setDoctor(null); setDate(''); setHour(''); setError(''); };
  const handleDoctorSelect = (d) => { setDoctor(d); setDate(''); setHour(''); setError(''); };
  const handleDateChange = (v) => { setDate(v); setHour(''); setError(''); };
  const datosCompletos = form.dni && form.date_of_birth && form.first_name && form.last_name && form.email;
  const handleSubmit = async () => {
    setError('');
    if (!datosCompletos) { setError('Completá tus datos personales antes de confirmar.'); return; }
    const existing = api.patients().find((p) => p.dni === form.dni.trim());
    if (existing && existing.date_of_birth !== form.date_of_birth) { setError('Ya hay un paciente registrado con ese DNI, pero la fecha de nacimiento no coincide.'); return; }
    setSaving(true); await sleep(600);
    api.update((n) => {
      let pid = existing?.id_user;
      if (!pid) { pid = ++n.seq.user; n.users = [...n.users, { id_user: pid, rol: 'Patient', is_active: true, photo: null, country: 'Argentina', address: '', emergency_contact: '', username: form.dni.trim(), password: form.dni.trim(), dni: form.dni.trim(), date_of_birth: form.date_of_birth, first_name: form.first_name, last_name: form.last_name, email: form.email, phone_number: form.phone_number, gender: '', health_plan_status: false, health_plan_name: '', member_number: '' }]; api.log(n, form.dni.trim(), 'CREAR', 'patients', pid, 'Registro creado en la tabla patients (turno público)'); }
      const id = ++n.seq.ap;
      n.appointments = [...n.appointments, { id_medical_appointment: id, id_patient: pid, id_doctor: doctor.id_user, date, hour, status: 'Reservado', reason: reason || null, confirmed: false, is_overbooking: false, disease_type: null, diagnosis: null, disease_details: null, diagnosis_created_at: null }];
      api.log(n, form.dni.trim(), 'CREAR', 'medical_appointment', id, 'Registro creado en la tabla medical_appointment (público)');
    });
    setSaving(false);
    setBooked({ doctor: fullName(doctor), date, hour });
  };
  if (booked) {
    return (
      <Box sx={{ maxWidth: 620, mx: 'auto' }}>
        <Card sx={{ p: 4, textAlign: 'center' }}>
          <CheckCircleIcon sx={{ fontSize: 64, color: '#2e7d32', mb: 1 }} />
          <Typography variant="h5" fontWeight={800} color="#0E4C82" gutterBottom>Turno reservado</Typography>
          <Typography color="#34495e" sx={{ mb: 2 }}>{booked.doctor}<br /><strong>{formatDate(booked.date)} a las {booked.hour}</strong></Typography>
          <Alert severity="info" sx={{ textAlign: 'left', mb: 2 }}>Podés ver, confirmar o cancelar este turno entrando con tu DNI como usuario y contraseña.</Alert>
          <Box sx={{ display: 'flex', gap: 1, justifyContent: 'center', flexWrap: 'wrap' }}>
            <Button variant="contained" component={RouterLink} to="/">Iniciar sesión</Button>
            <Button variant="outlined" onClick={() => { setBooked(null); setSpecialtyId(''); setDoctor(null); setDate(''); setHour(''); setReason(''); }}>Sacar otro turno</Button>
          </Box>
        </Card>
      </Box>
    );
  }
  return (
    <Box sx={{ maxWidth: 780, mx: 'auto' }}>
      <Button component={RouterLink} to="/" startIcon={<ArrowBackIcon />} sx={{ mb: 1, color: '#1565A8', fontWeight: 600 }}>Volver al inicio</Button>
      <Box sx={{ mb: 3, textAlign: 'center' }}>
        <Typography variant="h4" fontWeight={800} color="#0E4C82">Sacar turno</Typography>
        <Typography variant="body1" color="#5b7387">No necesitás cuenta. Completá tus datos y elegí el horario.</Typography>
      </Box>
      {error && <Alert severity="error" sx={{ mb: 2 }} onClose={() => setError('')}>{error}</Alert>}
      <Card sx={{ p: 2.5, mb: 2 }}>
        <StepTitle number={1}>Tus datos</StepTitle>
        <Box sx={{ display: 'flex', gap: 2, flexWrap: 'wrap' }}>
          <TextField size="small" label="DNI" required sx={{ flex: '1 1 45%' }} value={form.dni} onChange={(e) => setForm({ ...form, dni: e.target.value })} />
          <TextField size="small" label="Fecha de nacimiento" type="date" required sx={{ flex: '1 1 45%' }} slotProps={{ inputLabel: { shrink: true } }} value={form.date_of_birth} onChange={(e) => setForm({ ...form, date_of_birth: e.target.value })} />
          <TextField size="small" label="Nombre" required sx={{ flex: '1 1 45%' }} value={form.first_name} onChange={(e) => setForm({ ...form, first_name: e.target.value })} />
          <TextField size="small" label="Apellido" required sx={{ flex: '1 1 45%' }} value={form.last_name} onChange={(e) => setForm({ ...form, last_name: e.target.value })} />
          <TextField size="small" label="Email" type="email" required sx={{ flex: '1 1 45%' }} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
          <TextField size="small" label="Teléfono" sx={{ flex: '1 1 45%' }} value={form.phone_number} onChange={(e) => setForm({ ...form, phone_number: e.target.value })} />
        </Box>
        <Typography variant="caption" color="#5b7387" sx={{ mt: 1.5, display: 'block' }}>Si ya sos paciente de la clínica, el DNI y la fecha de nacimiento tienen que coincidir con los que tenemos registrados. ¿Ya tenés cuenta?{' '}<Link component={RouterLink} to="/">Iniciá sesión</Link>.</Typography>
      </Card>
      <Card sx={{ p: 2.5, mb: 2 }}>
        <StepTitle number={2}>Especialidad</StepTitle>
        <SpecialtySuggester onSelect={(id) => handleSpecialtyChange(id)} />
        <TextField select fullWidth size="small" label="Elegí una especialidad" value={specialtyId} onChange={(e) => handleSpecialtyChange(e.target.value)}>
          {SPECIALTIES.map((s) => <MenuItem key={s.id_speciality} value={s.id_speciality}>{s.name}</MenuItem>)}
        </TextField>
      </Card>
      {specialtyId && (
        <Card sx={{ p: 2.5, mb: 2 }}>
          <StepTitle number={3}>Profesional</StepTitle>
          {doctors.length === 0 && <Typography variant="body2" color="#5b7387">No hay profesionales disponibles en esta especialidad.</Typography>}
          <DoctorPicker doctors={doctors} doctor={doctor} onPick={handleDoctorSelect} />
        </Card>
      )}
      {doctor && (
        <Card sx={{ p: 2.5, mb: 2 }}>
          <StepTitle number={4}>Fecha y horario</StepTitle>
          <TextField type="date" size="small" label="Fecha" value={date} onChange={(e) => handleDateChange(e.target.value)} slotProps={{ inputLabel: { shrink: true }, htmlInput: { min: today } }} sx={{ mb: 2 }} />
          {date && freeCount === 0 && grid.length > 0 && <Alert severity="warning" sx={{ mb: 1 }}>No quedan horarios libres para esa fecha: el profesional tiene la agenda completa. Probá con otro día.</Alert>}
          {date && grid.length === 0 && <Typography variant="body2" color="#5b7387">No hay horarios de atención para esa fecha.</Typography>}
          {grid.filter((g) => g.status === 'taken').length > 0 && <Alert severity="info" sx={{ mb: 1.5 }}>Horarios ya reservados: {grid.filter((g) => g.status === 'taken').map((g) => g.hour).join(' · ')}</Alert>}
          <SlotGrid displayGrid={displayGrid} hour={hour} setHour={setHour} conflictTitle={() => 'Ya tenés un turno a esta hora'} />
          {displayGrid.some((g) => g.conflict) && <Alert severity="warning" sx={{ mt: 1.5 }}>Los horarios en naranja no están disponibles porque ya tenés otro turno a esa hora. No podés estar con dos profesionales al mismo tiempo.</Alert>}
          {grid.length > 0 && <Typography variant="caption" color="#5b7387" sx={{ mt: 1, display: 'block' }}>{freeCount} horario(s) libre(s) · los tachados ya están reservados</Typography>}
        </Card>
      )}
      {hour && (
        <Card sx={{ p: 2.5, mb: 4 }}>
          <StepTitle number={5}>Confirmar</StepTitle>
          <Typography variant="body2" color="#34495e" sx={{ mb: 2 }}>Turno con <strong>{doctor.first_name} {doctor.last_name}</strong> el <strong>{formatDate(date)}</strong> a las <strong>{hour}</strong>.</Typography>
          <TextField fullWidth size="small" label="Motivo de la consulta (opcional)" value={reason} onChange={(e) => setReason(e.target.value)} sx={{ mb: 2 }} />
          <Divider sx={{ mb: 2 }} />
          <Button variant="contained" onClick={handleSubmit} disabled={saving}>{saving ? 'Reservando...' : 'Reservar turno'}</Button>
        </Card>
      )}
    </Box>
  );
}

// ---------- Detalle de noticia con IA (pages/NewsDetail.jsx) ----------
function NewsDetail() {
  const { id } = useParams();
  const api = useDb();
  const navigate = useNavigate();
  const item = api.db.news.find((n) => n.id_news_and_prevention === Number(id));
  const [simple, setSimple] = useState('');
  const [loadingSimple, setLoadingSimple] = useState(false);
  const [simpleError, setSimpleError] = useState('');
  const [chatOpen, setChatOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [question, setQuestion] = useState('');
  const [loadingAnswer, setLoadingAnswer] = useState(false);
  const [chatError, setChatError] = useState('');
  const chatEndRef = useRef(null);
  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loadingAnswer]);
  if (!item) return <Box sx={{ maxWidth: 760, mx: 'auto' }}><Typography color="#5b7387">Cargando noticia...</Typography></Box>;
  const handleSimplify = async () => { setSimpleError(''); setLoadingSimple(true); try { setSimple(await aiSimplifyNews(item)); } catch { setSimpleError('No se pudo generar la explicación.'); } finally { setLoadingSimple(false); } };
  const handleAsk = async () => {
    const q = question.trim(); if (!q || loadingAnswer) return;
    setChatError(''); setQuestion(''); setMessages((prev) => [...prev, { role: 'user', text: q }]); setLoadingAnswer(true);
    try { const a = await aiChatNews(item, q); setMessages((prev) => [...prev, { role: 'assistant', text: a }]); } catch { setChatError('No se pudo responder la pregunta.'); } finally { setLoadingAnswer(false); }
  };
  return (
    <Box sx={{ maxWidth: 760, mx: 'auto' }}>
      <Button startIcon={<ArrowBackIcon />} onClick={() => navigate('/noticias')} sx={{ mb: 2, color: '#1565A8', fontWeight: 600 }}>Volver a noticias</Button>
      <Card sx={{ borderRadius: 3, overflow: 'hidden' }}>
        {item.photo && <CardMedia component="img" image={item.photo} alt={item.title} sx={{ maxHeight: 340, objectFit: 'cover' }} />}
        <Box sx={{ p: 4 }}>
          <Chip label={item.category} size="small" sx={{ mb: 2, fontWeight: 700, bgcolor: item.category === 'Prevención' ? '#e4f5ee' : '#fdf1e0', color: item.category === 'Prevención' ? '#1a8a5a' : '#c77f1a' }} />
          <Typography variant="h4" fontWeight={800} color="#0E4C82" sx={{ mb: 1 }}>{item.title}</Typography>
          <Typography variant="caption" color="#94a3b8" sx={{ display: 'block', mb: 3 }}>{formatDateLong(item.date)}</Typography>
          <Typography variant="body1" color="#334155" sx={{ lineHeight: 1.8 }}>{item.content}</Typography>
          <Box sx={{ mt: 3 }}>
            {!simple && <Button variant="outlined" startIcon={loadingSimple ? <CircularProgress size={16} /> : <AutoAwesomeIcon />} onClick={handleSimplify} disabled={loadingSimple}>{loadingSimple ? 'Generando...' : 'Explicámelo simple'}</Button>}
            {simpleError && <Alert severity="warning" sx={{ mt: 2 }} onClose={() => setSimpleError('')}>{simpleError}</Alert>}
            {simple && (
              <Box sx={{ mt: 2, p: 2.5, borderRadius: 2, bgcolor: '#f0f9fe', border: '1px solid #cfe8f7' }}>
                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 1.5 }}><AutoAwesomeIcon sx={{ fontSize: 18, color: '#1565A8' }} /><Typography variant="subtitle2" fontWeight={700} color="#0E4C82">En palabras simples</Typography></Box>
                <TextoFormateado text={simple} variant="body1" lh={1.8} pl={2} />
                <Typography variant="caption" color="#5b7387" sx={{ display: 'block', mt: 1.5 }}>Explicación generada automáticamente a partir de la noticia. Ante cualquier duda sobre tu salud, consultá con un profesional.</Typography>
                <Button size="small" sx={{ mt: 1 }} onClick={() => setSimple('')}>Ocultar</Button>
              </Box>
            )}
          </Box>
          <Box sx={{ mt: 2 }}>
            {!chatOpen ? (
              <Button variant="text" startIcon={<ChatIcon />} onClick={() => setChatOpen(true)}>Tengo dudas sobre este tema</Button>
            ) : (
              <Box sx={{ borderRadius: 2, border: '1px solid #e2e8f0', overflow: 'hidden' }}>
                <Box sx={{ px: 2.5, py: 1.5, bgcolor: '#f8fafc', borderBottom: '1px solid #e2e8f0', display: 'flex', alignItems: 'center', gap: 1 }}>
                  <ChatIcon sx={{ fontSize: 18, color: '#1565A8' }} /><Typography variant="subtitle2" fontWeight={700} color="#0E4C82">Preguntá sobre este tema</Typography>
                </Box>
                <Box sx={{ p: 2.5, maxHeight: 420, overflowY: 'auto' }}>
                  {messages.length === 0 && <Typography variant="body2" color="#5b7387">Podés preguntar qué significa algo, pedir recomendaciones generales, o cómo sacar un turno. Por ejemplo: <em>"¿quiénes tienen que vacunarse?"</em></Typography>}
                  {messages.map((m, i) => {
                    const esUsuario = m.role === 'user';
                    return (
                      <Box key={i} sx={{ display: 'flex', gap: 1.5, mb: 2, flexDirection: esUsuario ? 'row-reverse' : 'row' }}>
                        <Avatar sx={{ width: 30, height: 30, fontSize: 13, bgcolor: esUsuario ? '#0E4C82' : '#29ABE2' }}>{esUsuario ? 'Vos' : <AutoAwesomeIcon sx={{ fontSize: 16 }} />}</Avatar>
                        <Box sx={{ maxWidth: '85%', p: 1.5, borderRadius: 2, bgcolor: esUsuario ? '#e8f4fb' : '#f8fafc' }}>
                          {esUsuario ? <Typography variant="body2" color="#0E4C82">{m.text}</Typography> : <TextoFormateado text={m.text} />}
                        </Box>
                      </Box>
                    );
                  })}
                  {loadingAnswer && <Box sx={{ display: 'flex', gap: 1.5, alignItems: 'center' }}><Avatar sx={{ width: 30, height: 30, bgcolor: '#29ABE2' }}><AutoAwesomeIcon sx={{ fontSize: 16 }} /></Avatar><CircularProgress size={18} /></Box>}
                  <div ref={chatEndRef} />
                </Box>
                {chatError && <Alert severity="warning" sx={{ mx: 2.5, mb: 1 }} onClose={() => setChatError('')}>{chatError}</Alert>}
                <Box sx={{ p: 2, borderTop: '1px solid #e2e8f0', display: 'flex', gap: 1 }}>
                  <TextField fullWidth size="small" placeholder="Escribí tu pregunta" value={question} onChange={(e) => setQuestion(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAsk(); } }} slotProps={{ htmlInput: { maxLength: 400 } }} disabled={loadingAnswer} />
                  <Button variant="contained" onClick={handleAsk} disabled={loadingAnswer || !question.trim()} sx={{ minWidth: 44, px: 2 }}><SendIcon fontSize="small" /></Button>
                </Box>
                <Typography variant="caption" color="#5b7387" sx={{ display: 'block', px: 2.5, pb: 2 }}>Respuestas generadas automáticamente. No reemplazan una consulta médica: si tenés dudas sobre tu salud, sacá un turno. Ante una urgencia, llamá al 107.</Typography>
              </Box>
            )}
          </Box>
        </Box>
      </Card>
    </Box>
  );
}

function SignosPage() {
  const api = useDb();

  const openCreateDialog = () => { setFormError(''); setErrors({}); setEditingRow(null); setObservationOnlyMode(false); setF({ id_patient: '', temperature: '', blood_pressure: '', signs: '', symptoms: '', observations: '', record_type: 'Rutina' }); setOpen(true); };
  const openEditDialog = (row) => { setFormError(''); setErrors({}); setEditingRow(row); const restricted = !isEditable(row); setObservationOnlyMode(restricted); setF({ id_patient: row.id_patient, temperature: row.temperature, blood_pressure: row.blood_pressure, signs: row.signs || '', symptoms: row.symptoms || '', observations: restricted ? '' : row.observations || '', record_type: row.record_type }); setOpen(true); };

      api.update((n) => { n.signs = n.signs.map((s) => (s.id_signs_and_symptoms === editingRow.id_signs_and_symptoms ? { ...s, observations: [s.observations, `[${formatDateTime(nowIso())}] ${f.observations.trim()}`].filter(Boolean).join('\n') } : s)); });
      setOpen(false); return;
    }
    const errs = {};
    if (!f.id_patient) errs.id_patient = 'Elegí un paciente';
    if (f.temperature === '' || Number.isNaN(Number(f.temperature))) errs.temperature = 'Ingresá la temperatura';
    if (!f.blood_pressure) errs.blood_pressure = 'Ingresá la presión arterial';
    if (!f.symptoms) errs.symptoms = 'Describí los síntomas';
    setErrors(errs); if (Object.keys(errs).length) return;
    api.update((n) => {
      if (editingRow) n.signs = n.signs.map((s) => (s.id_signs_and_symptoms === editingRow.id_signs_and_symptoms ? { ...s, ...f, temperature: Number(f.temperature) } : s));
      else { const id = ++n.seq.sign; n.signs = [{ id_signs_and_symptoms: id, id_nurse: userId, ...f, id_patient: Number(f.id_patient), temperature: Number(f.temperature), date_and_time: nowIso() }, ...n.signs]; api.log(n, api.user(userId).username, 'CREAR', 'signs_and_symptoms', id, 'Registro creado en la tabla signs_and_symptoms'); }
    });
    setOpen(false);
  };
  const confirmDelete = () => { api.update((n) => { n.signs = n.signs.filter((s) => s.id_signs_and_symptoms !== deleteTarget.id_signs_and_symptoms); }); setDeleteTarget(null); };
  const saveAllergies = () => { api.update((n) => { n.users = n.users.map((u) => (u.id_user === allergyTarget.id ? { ...u, allergies: allergyValue } : u)); }); setAllergyTarget(null); };
  const Ctl = (p) => <TextField {...p} />;
  return (
    <Box>
      <PageHeader title="Signos y síntomas" desc="Registro clínico en tiempo real" action={<Button variant="contained" startIcon={<AddIcon />} onClick={openCreateDialog}>Registrar</Button>} />
      <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 2 }}>
        <DatePicker label="Día" value={selectedDate} onChange={setSelectedDate} slotProps={{ textField: { size: 'small' } }} />
        <Button size="small" onClick={() => setSelectedDate(todayStr())}>Hoy</Button>
      </Box>
      <TableContainer component={Paper}>
        <Table>
          <TableHead><TableRow>{['Paciente', 'DNI', 'Edad', 'Temp.', 'Presión', 'Síntomas', 'Signos', 'Tipo', 'Fecha/Hora'].map((h) => <TableCell key={h}>{h}</TableCell>)}<TableCell align="right">Acciones</TableCell></TableRow></TableHead>
          <TableBody>
            {visibleRows.map((r) => {
              const patient = api.user(r.id_patient); const editable = isEditable(r);
              return (
                <TableRow key={r.id_signs_and_symptoms}>
                  <TableCell sx={{ fontWeight: 600 }}>{api.name(r.id_patient)}{patient?.allergies && <Tooltip title={`Alergias: ${patient.allergies}`}><WarningAmberIcon fontSize="small" sx={{ color: paletteRaw.danger, ml: 0.5, verticalAlign: 'middle' }} /></Tooltip>}</TableCell>
                  <TableCell>{getPatientDni(patient)}</TableCell>
                  <TableCell>{getPatientAge(patient?.date_of_birth) ?? '—'}</TableCell>
                  <TableCell sx={{ color: r.temperature >= 38 ? paletteRaw.danger : 'inherit', fontWeight: r.temperature >= 38 ? 700 : 400 }}>{r.temperature}°C</TableCell>
                  <TableCell>{r.blood_pressure || '—'}</TableCell>
                  <TableCell>{r.symptoms}</TableCell>
                  <TableCell>{r.signs || '—'}</TableCell>
                  <TableCell><Chip size="small" label={r.record_type} color={r.record_type === 'Urgencia' ? 'error' : 'primary'} /></TableCell>
                  <TableCell sx={{ color: paletteRaw.gray, whiteSpace: 'nowrap' }}>{formatDateTime(r.date_and_time)}</TableCell>
                  <TableCell align="right" sx={{ whiteSpace: 'nowrap' }}>
                    <Tooltip title="Historial clínico"><IconButton size="small" onClick={() => setHistoryPatient(patient)}><HistoryIcon fontSize="small" /></IconButton></Tooltip>
                    <Tooltip title="Alergias"><IconButton size="small" onClick={() => { setAllergyValue(patient?.allergies || ''); setAllergyTarget({ id: r.id_patient, name: api.name(r.id_patient) }); }}><WarningAmberIcon fontSize="small" sx={{ color: paletteRaw.danger }} /></IconButton></Tooltip>
                    <Tooltip title={editable ? 'Editar' : 'Ya pasaron 5 minutos del registro — solo se puede agregar una observación'}><IconButton size="small" onClick={() => openEditDialog(r)}><EditIcon fontSize="small" /></IconButton></Tooltip>
                    <IconButton size="small" onClick={() => setDeleteTarget(r)}><DeleteIcon fontSize="small" sx={{ color: paletteRaw.danger }} /></IconButton>
                  </TableCell>
                </TableRow>
              );
            })}
            {visibleRows.length === 0 && <TableRow><TableCell colSpan={10} align="center" sx={{ color: paletteRaw.gray }}>No hay registros para el día seleccionado.</TableCell></TableRow>}
          </TableBody>
        </Table>
      </TableContainer>

      <Dialog open={open} onClose={() => setOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>{observationOnlyMode ? 'Agregar observación' : editingRow ? 'Editar signos y síntomas' : 'Registrar signos y síntomas'}</DialogTitle>
        <Box component="form" onSubmit={onSubmit} noValidate>
          <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {formError && <Alert severity="error">{formError}</Alert>}
            <TextField select label="Paciente" value={f.id_patient ?? ''} onChange={(e) => setF({ ...f, id_patient: e.target.value })} disabled={!!editingRow} error={!!errors.id_patient} helperText={errors.id_patient || (!editingRow && patientOptions.length === 0 ? 'No hay pacientes atendidos o en espera en este momento.' : '')}>
              {patientOptions.map((o) => <MenuItem key={o.id} value={o.id}>{o.label}</MenuItem>)}
            </TextField>
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField label="Temperatura (°C)" type="number" fullWidth inputProps={{ step: '0.1' }} value={f.temperature ?? ''} onChange={(e) => setF({ ...f, temperature: e.target.value })} error={!!errors.temperature} helperText={errors.temperature} disabled={observationOnlyMode} />
              <TextField label="Presión arterial" placeholder="120/80" fullWidth value={f.blood_pressure ?? ''} onChange={(e) => setF({ ...f, blood_pressure: e.target.value })} error={!!errors.blood_pressure} helperText={errors.blood_pressure} disabled={observationOnlyMode} />
            </Box>
            <TextField label="Síntomas reportados" value={f.symptoms ?? ''} onChange={(e) => setF({ ...f, symptoms: e.target.value })} error={!!errors.symptoms} helperText={errors.symptoms} disabled={observationOnlyMode} />
            <TextField label="Signos clínicos" value={f.signs ?? ''} onChange={(e) => setF({ ...f, signs: e.target.value })} disabled={observationOnlyMode} />

            <TextField label={observationOnlyMode ? 'Nueva observación' : 'Observaciones'} multiline minRows={2} value={f.observations ?? ''} onChange={(e) => setF({ ...f, observations: e.target.value })} error={!!errors.observations} helperText={errors.observations} />
            <TextField select label="Tipo" value={f.record_type ?? 'Rutina'} onChange={(e) => setF({ ...f, record_type: e.target.value })} disabled={observationOnlyMode}><MenuItem value="Rutina">Rutina</MenuItem><MenuItem value="Urgencia">Urgencia</MenuItem></TextField>
          </DialogContent>
          <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setOpen(false)}>Cancelar</Button><Button type="submit" variant="contained">{observationOnlyMode ? 'Agregar' : 'Guardar'}</Button></DialogActions>
        </Box>
      </Dialog>

      <Dialog open={!!deleteTarget} onClose={() => setDeleteTarget(null)} fullWidth maxWidth="xs">
        <DialogTitle>Eliminar registro</DialogTitle>
        <DialogContent><Typography variant="body2">¿Seguro que querés eliminar este registro de signos y síntomas{deleteTarget ? ` de ${api.name(deleteTarget.id_patient)}` : ''}? Esta acción no se puede deshacer.</Typography></DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setDeleteTarget(null)}>Cancelar</Button><Button color="error" variant="contained" onClick={confirmDelete}>Eliminar</Button></DialogActions>
      </Dialog>

      <MedicalHistoryDialog open={!!historyPatient} onClose={() => setHistoryPatient(null)} patientId={historyPatient?.id_user} patientName={fullName(historyPatient)} patientDni={getPatientDni(historyPatient)} patientAge={getPatientAge(historyPatient?.date_of_birth)} />

      <Dialog open={!!allergyTarget} onClose={() => setAllergyTarget(null)} fullWidth maxWidth="xs">
        <DialogTitle>Alergias{allergyTarget ? ` — ${allergyTarget.name}` : ''}</DialogTitle>
        <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}><TextField label="Alergias" multiline minRows={3} fullWidth placeholder="Ej: Penicilina, polen" value={allergyValue} onChange={(e) => setAllergyValue(e.target.value)} sx={{ mt: 1 }} /></DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setAllergyTarget(null)}>Cancelar</Button><Button variant="contained" onClick={saveAllergies}>Guardar</Button></DialogActions>
      </Dialog>
    </Box>
  );
}

// ---------- Seguimiento (pages/Seguimiento.jsx) ----------
const FU_STATUS_LABELS = { active: 'Hoy', pending: 'Pendiente', scheduled: 'Programado', finished: 'Finalizado' };
const FU_FILTERS = [{ key: 'activos', label: 'Activos' }, { key: 'active', label: 'Hoy' }, { key: 'pending', label: 'Pendientes' }, { key: 'scheduled', label: 'Programados' }, { key: 'finished', label: 'Finalizados' }, { key: 'todos', label: 'Todos' }];
const fuStatusColor = (s) => (s === 'pending' ? 'error' : s === 'active' ? 'warning' : s === 'scheduled' ? 'info' : 'default');
function SeguimientoPage() {
  const api = useDb();
  const { userId } = useAuth();

  const [rescheduleTarget, setRescheduleTarget] = useState(null);
  const [rescheduleDate, setRescheduleDate] = useState('');
  const [rescheduleError, setRescheduleError] = useState('');
  const [historyPatient, setHistoryPatient] = useState(null);
  const rows = api.followUpsFull();
  const pendingCount = rows.filter((r) => r.status === 'pending' && r.id_nurse === userId).length;
  const filteredRows = rows.filter((r) => selectedFilter === 'todos' ? true : selectedFilter === 'activos' ? r.status !== 'finished' : r.status === selectedFilter);
  const attendedPatients = api.attendedToday();
  const openDialog = () => { setF({ id_patient: '', observations: '', next_check_up: '' }); setErrors({}); setOpen(true); };
  const onSubmit = (e) => {
    e.preventDefault(); const errs = {};
    if (!f.id_patient) errs.id_patient = 'Elegí un paciente';
    if (!f.observations.trim()) errs.observations = 'Escribí las observaciones';
    if (!f.next_check_up) errs.next_check_up = 'Elegí la fecha del próximo control';
    setErrors(errs); if (Object.keys(errs).length) return;
    api.update((n) => { const id = ++n.seq.fu; n.followUps = [{ id_follow_up: id, id_patient: Number(f.id_patient), id_nurse: userId, observations: f.observations.trim(), next_check_up: f.next_check_up, finish: false, date_time: nowIso() }, ...n.followUps]; api.log(n, api.user(userId).username, 'CREAR', 'patient_follow_up', id, 'Registro creado en la tabla patient_follow_up'); });
    setOpen(false);
  };
  const toggle = (id) => api.update((n) => { n.followUps = n.followUps.map((x) => (x.id_follow_up === id ? { ...x, finish: true } : x)); });
  const handleReschedule = () => { if (!rescheduleDate) { setRescheduleError('Elegí una fecha'); return; } api.update((n) => { n.followUps = n.followUps.map((x) => (x.id_follow_up === rescheduleTarget.id_follow_up ? { ...x, next_check_up: rescheduleDate } : x)); }); setRescheduleTarget(null); };
