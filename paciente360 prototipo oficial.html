      {pendingCount > 0 && <Alert severity="warning" sx={{ mb: 2 }}>Tenés {pendingCount} paciente(s) con seguimiento pendiente</Alert>}
      <Box sx={{ display: 'flex', gap: 1, mb: 3, flexWrap: 'wrap' }}>
        {FU_FILTERS.map((x) => <Chip key={x.key} label={x.label} onClick={() => setSelectedFilter(x.key)} color={selectedFilter === x.key ? 'primary' : 'default'} variant={selectedFilter === x.key ? 'filled' : 'outlined'} sx={{ fontWeight: 600 }} />)}
      </Box>
      <Grid container spacing={2}>
        {filteredRows.map((fu) => {
          const patient = api.user(fu.id_patient); const name = fu.patient_name; const age = getPatientAge(patient?.date_of_birth);
          const isMine = fu.id_nurse === userId;
          const canFinish = isMine && (fu.status === 'active' || fu.status === 'scheduled');
          const canReschedule = isMine && fu.status === 'pending';
          return (
            <Grid key={fu.id_follow_up} size={{ xs: 12, md: 6 }}>
              <Card sx={{ p: 2.5 }}>
                <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                    <Avatar sx={{ bgcolor: '#29ABE2', color: '#fff', fontWeight: 700 }}>{name.charAt(0)}</Avatar>
                    <Box>
                      <Typography fontWeight={700} color="#0E4C82">{name}</Typography>
                      <Typography variant="caption" color="#5b7387" display="block">DNI {getPatientDni(patient)}{age != null && ` — ${age} años`}</Typography>
                      <Typography variant="caption" color="#5b7387">{fu.date_time ? new Date(fu.date_time).toLocaleString('es-AR') : ''}</Typography>
                    </Box>
                  </Box>
                  <Chip size="small" label={FU_STATUS_LABELS[fu.status] || fu.status} color={fuStatusColor(fu.status)} />
                </Box>
                <Typography variant="body2" sx={{ mt: 2 }} color="#34495e">{fu.observations}</Typography>
                {fu.next_check_up && <Typography variant="caption" sx={{ mt: 1, display: 'block' }} color="#1565A8" fontWeight={700}>Próximo control: {formatDate(fu.next_check_up)}</Typography>}
                <Typography variant="caption" sx={{ mt: 0.5, display: 'block' }} color="#5b7387">Atendido por: {fu.nurse_name || '—'}{isMine && ' (vos)'}</Typography>
                <Box sx={{ mt: 2, display: 'flex', gap: 1, flexWrap: 'wrap' }}>
                  {canFinish && <Button size="small" variant="outlined" onClick={() => toggle(fu.id_follow_up)}>Marcar finalizado</Button>}
                  {canReschedule && <Button size="small" variant="outlined" color="info" onClick={() => { setRescheduleTarget(fu); setRescheduleDate(''); setRescheduleError(''); }}>Reprogramar</Button>}
                  <Button size="small" variant="text" onClick={() => setHistoryPatient(patient)}>Ver historia clínica</Button>
                </Box>
              </Card>
            </Grid>
          );
        })}
        {filteredRows.length === 0 && <Grid size={{ xs: 12 }}><Typography color="#5b7387">No hay seguimientos en esta categoría.</Typography></Grid>}
      </Grid>

      <Dialog open={open} onClose={() => setOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>Nuevo seguimiento</DialogTitle>
        <Box component="form" onSubmit={onSubmit} noValidate>
          <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {attendedPatients.length === 0 && <Alert severity="info">Todavía no hay pacientes atendidos hoy. El seguimiento se carga después de que el médico atienda al paciente.</Alert>}
            <TextField select label="Paciente" value={f.id_patient} onChange={(e) => setF({ ...f, id_patient: e.target.value })} disabled={attendedPatients.length === 0} error={!!errors.id_patient} helperText={errors.id_patient || 'Solo pacientes atendidos hoy'}>
              {attendedPatients.map((p) => <MenuItem key={p.id_user} value={p.id_user}>{p.first_name} {p.last_name} — DNI {getPatientDni(p)} — {getPatientAge(p.date_of_birth) ?? '—'} años{p.attended_by ? ` — atendido por ${p.attended_by}` : ''}</MenuItem>)}
            </TextField>
            <TextField label="Observaciones" multiline minRows={2} value={f.observations} onChange={(e) => setF({ ...f, observations: e.target.value })} error={!!errors.observations} helperText={errors.observations} />
            <TextField label="Próximo control" type="date" slotProps={{ inputLabel: { shrink: true }, htmlInput: { min: today } }} value={f.next_check_up} onChange={(e) => setF({ ...f, next_check_up: e.target.value })} error={!!errors.next_check_up} helperText={errors.next_check_up} />
          </DialogContent>
          <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setOpen(false)}>Cancelar</Button><Button type="submit" variant="contained" disabled={attendedPatients.length === 0}>Guardar</Button></DialogActions>
        </Box>
      </Dialog>

      <Dialog open={!!rescheduleTarget} onClose={() => setRescheduleTarget(null)} fullWidth maxWidth="xs">
        <DialogTitle>Reprogramar seguimiento</DialogTitle>
        <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {rescheduleTarget && <Typography variant="body2" color="#5b7387">Paciente: {rescheduleTarget.patient_name}</Typography>}
          {rescheduleError && <Alert severity="error">{rescheduleError}</Alert>}
          <TextField label="Nueva fecha de control" type="date" value={rescheduleDate} onChange={(e) => setRescheduleDate(e.target.value)} slotProps={{ inputLabel: { shrink: true }, htmlInput: { min: today } }} />
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setRescheduleTarget(null)}>Cancelar</Button><Button variant="contained" onClick={handleReschedule}>Guardar</Button></DialogActions>
      </Dialog>

      <MedicalHistoryDialog open={!!historyPatient} onClose={() => setHistoryPatient(null)} patientId={historyPatient?.id_user} patientName={fullName(historyPatient)} patientDni={getPatientDni(historyPatient)} patientAge={getPatientAge(historyPatient?.date_of_birth)} />
    </Box>
  );
}

// ---------- Control de stock (pages/nurse/StockPage.jsx) ----------
const PRODUCT_TYPES = ['Analgésicos', 'Antibióticos', 'Antivirales', 'Antiinflamatorios', 'Antipiréticos', 'Antihistamínicos', 'Antihipertensivos', 'Anestésicos', 'Vacunas', 'Soluciones y sueros', 'Descartables', 'Material de curación', 'Material de sutura', 'Instrumental médico', 'Equipos de protección personal (EPP)', 'Prótesis', 'Oxígeno y gases medicinales', 'Reactivos de laboratorio', 'Otro'];
function StockPage() {
  const api = useDb();
  const { userId } = useAuth();
  const readOnly = useReadOnly();
  const [tab, setTab] = useState('inv');
  const [invSearch, setInvSearch] = useState('');
  const [movSearch, setMovSearch] = useState('');
  const [movTypeFilter, setMovTypeFilter] = useState('');
  const [movSelectedDate, setMovSelectedDate] = useState(null);
  const [movSortOrder, setMovSortOrder] = useState('desc');
  const [trzSearch, setTrzSearch] = useState('');
  const [movOpen, setMovOpen] = useState(false);
  const [movF, setMovF] = useState({ id_product: '', type_movement: 'Entrada', quantity: '' });
  const [movError, setMovError] = useState('');
  const [traceOpen, setTraceOpen] = useState(false);
  const [trF, setTrF] = useState({ id_patient: '', name_product: '', quantity: '' });
  const [traceError, setTraceError] = useState('');
  const [productOpen, setProductOpen] = useState(false);
  const [prF, setPrF] = useState({});
  const [productError, setProductError] = useState('');
  const [alertsOpen, setAlertsOpen] = useState(false);
  const [deleteProductTarget, setDeleteProductTarget] = useState(null);
  const [highlightedProductId, setHighlightedProductId] = useState(null);
  const [duplicateNotice, setDuplicateNotice] = useState('');
  const products = api.db.products.filter((p) => p.is_active).map(api.productFlags);
  const lowStock = products.filter((p) => p.current_stock <= p.minimum_stock_level);
  const expiringProducts = products.filter((p) => p.por_vencer);
  const expiredProducts = api.db.products.map(api.productFlags).filter((p) => p.vencido);
  const visibleProducts = products.filter((p) => p.name_product.toLowerCase().includes(invSearch.toLowerCase()));
  const movements = api.db.movements.map((m) => ({ ...m, product_name: api.product(m.id_product)?.name_product }));
  const sortedMovements = movements.filter((m) => (m.product_name || '').toLowerCase().includes(movSearch.toLowerCase())).filter((m) => !movTypeFilter || m.type_movement === movTypeFilter).filter((m) => !movSelectedDate || sameDay(m.date_time, movSelectedDate)).sort((a, b) => (movSortOrder === 'asc' ? 1 : -1) * (new Date(a.date_time) - new Date(b.date_time)));
  const traceabilities = api.db.traceabilities.map((t) => { const p = api.product(t.id_product); return { ...t, product_name: p?.name_product, batch_number: p?.batch_number, expiration_date: p?.expiration_date }; });
  const visibleTraceabilities = traceabilities.filter((t) => `${t.product_name} ${api.name(t.id_patient)}`.toLowerCase().includes(trzSearch.toLowerCase())).sort((a, b) => new Date(b.date_of_use) - new Date(a.date_of_use));
  const availablePatients = api.patientsByStatus();
  const traceProductNames = [...new Set(products.filter((p) => p.current_stock > 0).map((p) => p.name_product))];
  // FEFO: del mismo nombre, el lote que vence primero
  const selectedTraceProduct = trF.name_product ? products.filter((p) => p.name_product === trF.name_product && p.current_stock > 0).sort((a, b) => (a.expiration_date || '').localeCompare(b.expiration_date || ''))[0] : null;
  const goToProduct = (id) => { setAlertsOpen(false); setTab('inv'); setInvSearch(''); setHighlightedProductId(id); setTimeout(() => setHighlightedProductId(null), 2500); };
  const onMovSubmit = (e) => {
    e.preventDefault(); setMovError('');
    const q = Number(movF.quantity);
    if (!movF.id_product) { setMovError('Elegí un producto'); return; }
    if (!(q > 0)) { setMovError('La cantidad debe ser mayor a 0'); return; }
    const p = api.product(Number(movF.id_product));
    if (movF.type_movement === 'Desechado' && q > p.current_stock) { setMovError(`No podés desechar más de lo que hay en stock (${p.current_stock}).`); return; }
    api.update((n) => { const id = ++n.seq.mov; n.movements = [...n.movements, { id_stock_movement: id, id_product: p.id_product, id_nurse: userId, type_movement: movF.type_movement, quantity: q, date_time: nowIso() }]; n.products = n.products.map((x) => (x.id_product === p.id_product ? { ...x, current_stock: x.current_stock + (movF.type_movement === 'Entrada' ? q : -q) } : x)); api.log(n, api.user(userId).username, 'CREAR', 'stock_movement', id, 'Registro creado en la tabla stock_movement'); });
    setMovOpen(false);
  };
  const onTraceSubmit = (e) => {
    e.preventDefault(); setTraceError('');
    const q = Number(trF.quantity);
    if (!trF.id_patient) { setTraceError('Elegí un paciente'); return; }
    if (!selectedTraceProduct) { setTraceError('Elegí un producto'); return; }
    if (!(q > 0) || !Number.isInteger(q)) { setTraceError('Ingresá una cantidad entera mayor a 0'); return; }
    if (q > selectedTraceProduct.current_stock) { setTraceError(`Stock insuficiente en el lote ${selectedTraceProduct.batch_number} (${selectedTraceProduct.current_stock}).`); return; }
    api.update((n) => { const mid = ++n.seq.mov; const tid = ++n.seq.trz; n.movements = [...n.movements, { id_stock_movement: mid, id_product: selectedTraceProduct.id_product, id_nurse: userId, type_movement: 'Salida', quantity: q, date_time: nowIso() }]; n.traceabilities = [...n.traceabilities, { id_traceability: tid, id_patient: Number(trF.id_patient), id_product: selectedTraceProduct.id_product, id_nurse: userId, quantity: q, id_stock_movement: mid, date_of_use: nowIso() }]; n.products = n.products.map((x) => (x.id_product === selectedTraceProduct.id_product ? { ...x, current_stock: x.current_stock - q } : x)); api.log(n, api.user(userId).username, 'CREAR', 'traceability', tid, 'Registro creado en la tabla traceability'); });
    setTraceOpen(false);
  };
  const onProductSubmit = (e) => {
    e.preventDefault(); setProductError('');
    if (!prF.name_product?.trim()) { setProductError('Ingresá el nombre del producto'); return; }
    if (prF.expiration_date && prF.expiration_date < todayStr()) { setProductError('La fecha de vencimiento no puede ser anterior a hoy'); return; }
    if (prF.current_stock === '' || Number(prF.current_stock) < 0) { setProductError('Ingresá el stock inicial'); return; }
    if (prF.minimum_stock_level === '' || Number(prF.minimum_stock_level) < 0) { setProductError('Ingresá el stock mínimo'); return; }
    const dup = api.db.products.find((p) => p.is_active && p.name_product.toLowerCase() === prF.name_product.trim().toLowerCase() && (p.batch_number || '') === (prF.batch_number || ''));
    if (dup) { setProductError('Ya existe ese producto con el mismo lote. Registrá una entrada de stock en vez de crearlo de nuevo.'); return; }
    api.update((n) => { const id = ++n.seq.prod; n.products = [...n.products, { id_product: id, name_product: prF.name_product.trim(), type_product: prF.type_product || '', batch_number: prF.batch_number || '', expiration_date: prF.expiration_date || null, current_stock: Number(prF.current_stock), minimum_stock_level: Number(prF.minimum_stock_level), is_active: true }]; if (Number(prF.current_stock) > 0) n.movements = [...n.movements, { id_stock_movement: ++n.seq.mov, id_product: id, id_nurse: userId, type_movement: 'Entrada', quantity: Number(prF.current_stock), date_time: nowIso() }]; api.log(n, api.user(userId).username, 'CREAR', 'medical_product', id, 'Registro creado en la tabla medical_product'); });
    const same = api.db.products.filter((p) => p.is_active && p.name_product.toLowerCase() === prF.name_product.trim().toLowerCase());
    if (same.length) setDuplicateNotice(`"${prF.name_product.trim()}" ya existía con otro lote: se creó como un lote nuevo y la trazabilidad descuenta primero el que vence antes (FEFO).`);
    setProductOpen(false);
  };
  const confirmDeleteProduct = () => { api.update((n) => { n.products = n.products.map((x) => (x.id_product === deleteProductTarget.id_product ? { ...x, is_active: false } : x)); api.log(n, api.user(userId).username, 'ELIMINAR_LOGICO', 'medical_product', deleteProductTarget.id_product, 'Baja lógica en la tabla medical_product (por vencer)'); }); setDeleteProductTarget(null); };
  const search = (label, v, set) => <TextField label={label} size="small" value={v} onChange={(e) => set(e.target.value)} />;
  return (
    <Box>
      <PageHeader mb={2} title="Control de stock" desc="Insumos, movimientos y trazabilidad" action={
        <Box sx={{ display: 'flex', gap: 1, alignItems: 'center' }}>
          <Badge badgeContent={lowStock.length + expiringProducts.length} color="warning"><Button variant="outlined" color="warning" startIcon={<WarningAmberIcon />} onClick={() => setAlertsOpen(true)}>Alertas</Button></Badge>
          {tab === 'inv' && <Button variant="contained" startIcon={<AddIcon />} onClick={() => { setPrF({ name_product: '', type_product: '', batch_number: '', expiration_date: '', current_stock: '', minimum_stock_level: '' }); setProductError(''); setProductOpen(true); }}>Nuevo producto</Button>}
          {tab === 'mov' && <Button variant="contained" startIcon={<AddIcon />} onClick={() => { setMovF({ id_product: '', type_movement: 'Entrada', quantity: '' }); setMovError(''); setMovOpen(true); }}>Movimiento</Button>}
          {tab === 'trz' && !readOnly && <Button variant="contained" startIcon={<AddIcon />} onClick={() => { setTrF({ id_patient: '', name_product: '', quantity: '' }); setTraceError(''); setTraceOpen(true); }}>Registrar uso</Button>}
        </Box>} />
      {duplicateNotice && <Alert severity="info" sx={{ mb: 2 }} onClose={() => setDuplicateNotice('')}>{duplicateNotice}</Alert>}
      <Tabs value={tab} onChange={(_, v) => setTab(v)} sx={{ mb: 2 }}><Tab value="inv" label="Inventario" /><Tab value="mov" label="Movimientos" /><Tab value="trz" label="Trazabilidad" /></Tabs>
      {tab === 'inv' && (
        <>
          <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 2, flexWrap: 'wrap' }}>{search('Buscar producto', invSearch, setInvSearch)}</Box>
          <TableContainer component={Paper}>
            <Table>
              <TableHead><TableRow>{['Producto', 'Tipo', 'Stock', 'Mínimo', 'Lote', 'Vence', 'Estado'].map((h) => <TableCell key={h}>{h}</TableCell>)}</TableRow></TableHead>
              <TableBody>
                {visibleProducts.map((p) => { const low = p.current_stock <= p.minimum_stock_level; return (
                  <TableRow key={p.id_product} sx={{ backgroundColor: highlightedProductId === p.id_product ? 'action.selected' : undefined, transition: 'background-color 0.3s' }}>
                    <TableCell sx={{ fontWeight: 600 }}>{p.name_product}</TableCell>
                    <TableCell><Chip size="small" label={p.type_product || '—'} /></TableCell>
                    <TableCell sx={{ color: low ? paletteRaw.danger : 'inherit', fontWeight: 700 }}>{p.current_stock}</TableCell>
                    <TableCell sx={{ color: paletteRaw.gray }}>{p.minimum_stock_level}</TableCell>
                    <TableCell>{p.batch_number || '—'}</TableCell>
                    <TableCell>{formatDate(p.expiration_date)}</TableCell>
                    <TableCell>{p.por_vencer ? (
                      <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, '&:hover .discard-btn': { opacity: 1 } }}>
                        <Chip size="small" label="Por vencer" color="warning" />
                        <Tooltip title="Dar de baja (por vencer)"><IconButton size="small" className="discard-btn" sx={{ opacity: 0, transition: 'opacity 0.15s' }} onClick={() => setDeleteProductTarget(p)}><DeleteIcon fontSize="small" sx={{ color: paletteRaw.danger }} /></IconButton></Tooltip>
                      </Box>) : <Chip size="small" label={low ? 'Reponer' : 'OK'} color={low ? 'error' : 'success'} />}</TableCell>
                  </TableRow>); })}
                {visibleProducts.length === 0 && <TableRow><TableCell colSpan={7} align="center" sx={{ color: paletteRaw.gray }}>No hay productos para el filtro seleccionado.</TableCell></TableRow>}
              </TableBody>
            </Table>
          </TableContainer>
        </>
      )}
      {tab === 'mov' && (
        <>
          <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 2, flexWrap: 'wrap' }}>
            {search('Buscar producto', movSearch, setMovSearch)}
            <TextField select label="Tipo" size="small" value={movTypeFilter} onChange={(e) => setMovTypeFilter(e.target.value)} sx={{ minWidth: 160 }}><MenuItem value="">Todos</MenuItem><MenuItem value="Entrada">Entrada</MenuItem><MenuItem value="Salida">Salida</MenuItem><MenuItem value="Desechado">Desechado</MenuItem></TextField>
            <DatePicker label="Día" value={movSelectedDate} onChange={setMovSelectedDate} slotProps={{ textField: { size: 'small' } }} />
            <Button size="small" onClick={() => setMovSelectedDate(todayStr())}>Hoy</Button>
            <Button size="small" onClick={() => setMovSelectedDate(null)}>Todos</Button>
          </Box>
          <TableContainer component={Paper}>
            <Table>
              <TableHead><TableRow><TableCell>Producto</TableCell><TableCell>Tipo</TableCell><TableCell>Cantidad</TableCell><TableCell><TableSortLabel active direction={movSortOrder} onClick={() => setMovSortOrder((p) => (p === 'asc' ? 'desc' : 'asc'))}>Fecha/Hora</TableSortLabel></TableCell></TableRow></TableHead>
              <TableBody>
                {sortedMovements.map((m) => (
                  <TableRow key={m.id_stock_movement}>
                    <TableCell sx={{ fontWeight: 600 }}>{m.product_name || '—'}</TableCell>
                    <TableCell><Chip size="small" label={m.type_movement} color={m.type_movement === 'Entrada' ? 'success' : m.type_movement === 'Desechado' ? 'error' : 'warning'} /></TableCell>
                    <TableCell>{m.quantity}</TableCell>
                    <TableCell sx={{ color: paletteRaw.gray }}>{formatDateTime(m.date_time)}</TableCell>
                  </TableRow>))}
                {sortedMovements.length === 0 && <TableRow><TableCell colSpan={4} align="center" sx={{ color: paletteRaw.gray }}>No hay movimientos para el filtro seleccionado.</TableCell></TableRow>}
              </TableBody>
            </Table>
          </TableContainer>
        </>
      )}
      {tab === 'trz' && (
        <>
          {expiredProducts.length > 0 && <Alert severity="error" sx={{ mb: 2 }}>PM vencidos: {expiredProducts.map((p) => p.name_product).join(', ')}</Alert>}
          <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 2, flexWrap: 'wrap' }}>{search('Buscar producto o paciente', trzSearch, setTrzSearch)}</Box>
          <TableContainer component={Paper}>
            <Table>
              <TableHead><TableRow>{['Paciente', 'DNI', 'Edad', 'Producto', 'Cantidad', 'Lote', 'Vence', 'Fecha de uso'].map((h) => <TableCell key={h}>{h}</TableCell>)}</TableRow></TableHead>
              <TableBody>
                {visibleTraceabilities.map((t) => { const patient = api.user(t.id_patient); return (
                  <TableRow key={t.id_traceability}>
                    <TableCell sx={{ fontWeight: 600 }}>{api.name(t.id_patient)}</TableCell>
                    <TableCell>{getPatientDni(patient)}</TableCell>
                    <TableCell>{getPatientAge(patient?.date_of_birth) ?? '—'}</TableCell>
                    <TableCell>{t.product_name || '—'}</TableCell>
                    <TableCell>{t.quantity}</TableCell>
                    <TableCell><Chip size="small" label={t.batch_number || '—'} /></TableCell>
                    <TableCell>{formatDate(t.expiration_date)}</TableCell>
                    <TableCell sx={{ color: paletteRaw.gray }}>{formatDateTime(t.date_of_use)}</TableCell>
                  </TableRow>); })}
                {visibleTraceabilities.length === 0 && <TableRow><TableCell colSpan={8} align="center" sx={{ color: paletteRaw.gray }}>No hay registros para el filtro seleccionado.</TableCell></TableRow>}
              </TableBody>
            </Table>
          </TableContainer>
        </>
      )}

      <Dialog open={movOpen} onClose={() => setMovOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>Movimiento de stock</DialogTitle>
        <Box component="form" onSubmit={onMovSubmit} noValidate>
          <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {movError && <Alert severity="error">{movError}</Alert>}
            <TextField select label="Producto" value={movF.id_product} onChange={(e) => setMovF({ ...movF, id_product: e.target.value })}>{products.map((p) => <MenuItem key={p.id_product} value={p.id_product}>{p.name_product} (stock {p.current_stock})</MenuItem>)}</TextField>
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField select label="Tipo" fullWidth value={movF.type_movement} onChange={(e) => setMovF({ ...movF, type_movement: e.target.value })}><MenuItem value="Entrada">Entrada</MenuItem><MenuItem value="Desechado">Desechado</MenuItem></TextField>
              <TextField label="Cantidad" type="number" fullWidth value={movF.quantity} onChange={(e) => setMovF({ ...movF, quantity: e.target.value })} />
            </Box>
          </DialogContent>
          <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setMovOpen(false)}>Cancelar</Button><Button type="submit" variant="contained">Aplicar</Button></DialogActions>
        </Box>
      </Dialog>

      <Dialog open={traceOpen} onClose={() => setTraceOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>Registrar uso de producto</DialogTitle>
        <Box component="form" onSubmit={onTraceSubmit} noValidate>
          <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {traceError && <Alert severity="error">{traceError}</Alert>}
            <TextField select label="Paciente" value={trF.id_patient} onChange={(e) => setTrF({ ...trF, id_patient: e.target.value })} helperText={availablePatients.length === 0 ? 'No hay pacientes atendidos o en espera en este momento.' : ''}>{availablePatients.map((p) => <MenuItem key={p.id_user} value={p.id_user}>{p.first_name} {p.last_name} — DNI {getPatientDni(p)}</MenuItem>)}</TextField>
            <TextField select label="Producto" value={trF.name_product} onChange={(e) => setTrF({ ...trF, name_product: e.target.value })}>{traceProductNames.map((name) => <MenuItem key={name} value={name}>{name}</MenuItem>)}</TextField>
            <TextField label="Cantidad (cajas)" type="number" fullWidth value={trF.quantity} onChange={(e) => setTrF({ ...trF, quantity: e.target.value })} />
            {selectedTraceProduct && <Alert severity="info">Se descuenta del lote {selectedTraceProduct.batch_number || '—'} (FEFO) · Vence {formatDate(selectedTraceProduct.expiration_date)}</Alert>}
          </DialogContent>
          <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setTraceOpen(false)}>Cancelar</Button><Button type="submit" variant="contained">Registrar</Button></DialogActions>
        </Box>
      </Dialog>

      <Dialog open={productOpen} onClose={() => setProductOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>Nuevo producto médico</DialogTitle>
        <Box component="form" onSubmit={onProductSubmit} noValidate>
          <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {productError && <Alert severity="error">{productError}</Alert>}
            <TextField label="Nombre del producto" fullWidth value={prF.name_product ?? ''} onChange={(e) => setPrF({ ...prF, name_product: e.target.value })} />
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField select label="Tipo" fullWidth value={prF.type_product ?? ''} onChange={(e) => setPrF({ ...prF, type_product: e.target.value })}>{PRODUCT_TYPES.map((t) => <MenuItem key={t} value={t}>{t}</MenuItem>)}</TextField>
              <TextField label="Número de lote" fullWidth value={prF.batch_number ?? ''} onChange={(e) => setPrF({ ...prF, batch_number: e.target.value })} />
            </Box>
            <TextField label="Fecha de vencimiento" type="date" fullWidth slotProps={{ inputLabel: { shrink: true }, htmlInput: { min: todayStr() } }} value={prF.expiration_date ?? ''} onChange={(e) => setPrF({ ...prF, expiration_date: e.target.value })} />
            <Box sx={{ display: 'flex', gap: 2 }}>
              <TextField label="Stock inicial" type="number" fullWidth value={prF.current_stock ?? ''} onChange={(e) => setPrF({ ...prF, current_stock: e.target.value })} />

// ---------- Gráficos SVG (reemplazan @mui/x-charts) ----------
const CHART_COLORS = [paletteRaw.azul, paletteRaw.celeste, paletteRaw.ok, paletteRaw.warn, paletteRaw.danger, paletteRaw.azulD, paletteRaw.celesteL];
function LineChartS({ labels, values, height = 260, color = paletteRaw.azul, label }) {
  const W = 640, H = height, px = 40, py = 24; const max = Math.max(1, ...values); const n = values.length;
  const x = (i) => px + (n > 1 ? (i * (W - px * 2)) / (n - 1) : (W - px * 2) / 2); const y = (v) => H - py - (v / max) * (H - py * 2);
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  const step = Math.max(1, Math.ceil(n / 10));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxHeight: H }}>
      {[0, 0.5, 1].map((t) => <g key={t}><line x1={px} x2={W - px} y1={y(max * t)} y2={y(max * t)} stroke="#E3EEF6" /><text x={px - 6} y={y(max * t) + 4} fontSize="10" textAnchor="end" fill={paletteRaw.gray}>{Math.round(max * t)}</text></g>)}
      <path d={`${d} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z`} fill={color} opacity="0.08" />
      <path d={d} fill="none" stroke={color} strokeWidth="2.5" />
      {values.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="3.5" fill="#fff" stroke={color} strokeWidth="2"><title>{`${labels[i]}: ${v}`}</title></circle>)}
      {labels.map((l, i) => (i % step === 0 ? <text key={i} x={x(i)} y={H - 6} fontSize="10" textAnchor="middle" fill={paletteRaw.gray}>{l}</text> : null))}
      {label && <text x={W - px} y={14} fontSize="11" textAnchor="end" fill={color} fontWeight="600">— {label}</text>}
    </svg>
  );
}
function BarChartS({ labels, values, height = 300, color = paletteRaw.azul }) {
  const W = 640, H = height, px = 40, py = 24, bottom = 70; const max = Math.max(1, ...values); const n = values.length; const bw = (W - px * 2) / n;
  const y = (v) => H - bottom - (v / max) * (H - py - bottom);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxHeight: H }}>
      {[0, 0.5, 1].map((t) => <g key={t}><line x1={px} x2={W - px} y1={y(max * t)} y2={y(max * t)} stroke="#E3EEF6" /><text x={px - 6} y={y(max * t) + 4} fontSize="10" textAnchor="end" fill={paletteRaw.gray}>{Math.round(max * t)}</text></g>)}
      {values.map((v, i) => <g key={i}><rect x={px + i * bw + bw * 0.2} width={bw * 0.6} y={y(v)} height={H - bottom - y(v)} rx="4" fill={color}><title>{`${labels[i]}: ${v}`}</title></rect><text x={px + i * bw + bw / 2} y={y(v) - 5} fontSize="10" textAnchor="middle" fill={paletteRaw.ink}>{v}</text>
        <foreignObject x={px + i * bw} y={H - bottom + 6} width={bw} height={bottom - 6}><div xmlns="http://www.w3.org/1999/xhtml" style={{ fontSize: 10, textAlign: 'center', color: paletteRaw.gray, lineHeight: 1.2 }}>{labels[i]}</div></foreignObject></g>)}
    </svg>
  );
}
function PieChartS({ data, height = 300 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1; const R = 100, r = 40, cx = 130, cy = 130; let a = -Math.PI / 2;
  const arcs = data.map((d, i) => { const ang = (d.value / total) * Math.PI * 2; const a0 = a, a1 = a + ang; a = a1; const big = ang > Math.PI ? 1 : 0; const p = (rad, t) => [cx + rad * Math.cos(t), cy + rad * Math.sin(t)]; const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0); return { ...d, color: CHART_COLORS[i % CHART_COLORS.length], path: `M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z` }; });
  return (
    <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, flexWrap: 'wrap' }}>
      <svg viewBox="0 0 260 260" width="260" height={Math.min(260, height)}>{arcs.map((d, i) => <path key={i} d={d.path} fill={d.color}><title>{`${d.label}: ${d.value}`}</title></path>)}</svg>
      <Box>{arcs.map((d, i) => <Box key={i} sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 0.5 }}><Box sx={{ width: 12, height: 12, borderRadius: '3px', bgcolor: d.color }} /><Typography variant="caption" color={paletteRaw.ink}>{d.label} ({d.value})</Typography></Box>)}</Box>
    </Box>
  );
}

// ---------- Estadísticas (pages/nurse/EstadisticasPage.jsx) ----------
function KpiCard({ label, value }) {
  return <Paper sx={{ p: 2, textAlign: 'center' }}><Typography variant="body2" color={paletteRaw.gray}>{label}</Typography><Typography variant="h4" fontWeight={800} color={paletteRaw.azulD}>{value}</Typography></Paper>;
}
function EstadisticasPage() {
  const api = useDb();
  const [dateFrom, setDateFrom] = useState(addDays(-29));
  const [dateTo, setDateTo] = useState(todayStr());
  const [applied, setApplied] = useState({ from: addDays(-29), to: todayStr() });
  const inRange = (ymd) => ymd >= applied.from && ymd <= applied.to;
  const attended = api.db.appointments.filter((a) => a.status === 'Atendido' && inRange(a.date));
  const cancelled = api.db.appointments.filter((a) => a.status === 'Cancelado' && inRange(a.date));
  const attendedTotal = attended.length;
  const absenteeism = { absenteeism_rate: attendedTotal + cancelled.length ? Math.round((cancelled.length / (attendedTotal + cancelled.length)) * 1000) / 10 : 0 };
  const diseases = Object.entries(attended.reduce((acc, a) => { const k = a.disease_type || 'Sin clasificar'; acc[k] = (acc[k] || 0) + 1; return acc; }, {})).map(([label, count]) => ({ label, count })).sort((a, b) => b.count - a.count);
  const supply = Object.entries(api.db.movements.filter((m) => m.type_movement === 'Salida' && inRange(toYMD(new Date(m.date_time)))).reduce((acc, m) => { const k = api.product(m.id_product)?.type_product || 'Otro'; acc[k] = (acc[k] || 0) + m.quantity; return acc; }, {})).map(([type_product, total_quantity]) => ({ type_product, total_quantity }));
  const trend = []; for (let d = applied.from; d <= applied.to; d = addDays(1, d)) trend.push({ date: d, count: attended.filter((a) => a.date === d).length });
  const products = api.db.products.filter((p) => p.is_active).map(api.productFlags);
  const lowStock = products.filter((p) => p.current_stock <= p.minimum_stock_level);
  const expiringProducts = api.db.products.map(api.productFlags).filter((p) => p.vencido || p.por_vencer).sort((a, b) => (a.vencido === b.vencido ? (a.expiration_date || '').localeCompare(b.expiration_date || '') : a.vencido ? -1 : 1));
  const downloadStatsPdf = () => downloadText(`estadisticas_${applied.from}_${applied.to}.txt`, ['PACIENTE360º — Reporte de Estadísticas', `Período: ${formatDate(applied.from)} — ${formatDate(applied.to)}`, `Pacientes atendidos: ${attendedTotal}`, `Ausentismo: ${absenteeism.absenteeism_rate}%`, '', 'Enfermedad | Cantidad', ...diseases.map((d) => `${d.label} | ${d.count}`), '', 'Categoría de insumo | Cantidad consumida', ...supply.map((s) => `${s.type_product} | ${s.total_quantity}`), '', 'Insumo con stock bajo | Stock actual | Stock mínimo', ...lowStock.map((p) => `${p.name_product} | ${p.current_stock} | ${p.minimum_stock_level}`), '', 'Insumo por vencer/vencido | Vencimiento | Estado', ...expiringProducts.map((p) => `${p.name_product} | ${formatDate(p.expiration_date)} | ${p.vencido ? 'Vencido' : 'Por vencer'}`)]);
  const Sec = ({ title, children, sx }) => <Paper sx={{ p: 2, ...sx }}><Typography variant="subtitle1" fontWeight={700} color={paletteRaw.azulD} sx={{ mb: 1 }}>{title}</Typography>{children}</Paper>;
  const empty = <Typography color={paletteRaw.gray}>Sin datos en el período seleccionado.</Typography>;
  return (
    <Box>
      <PageHeader title="Estadísticas" desc="Reportes clínicos y de insumos por período" action={<Tooltip title="Descargar reporte en PDF"><span><IconButton onClick={downloadStatsPdf}><PictureAsPdfIcon sx={{ color: paletteRaw.azul }} /></IconButton></span></Tooltip>} />
      <Box sx={{ display: 'flex', gap: 2, alignItems: 'center', mb: 3, flexWrap: 'wrap' }}>
        <DatePicker label="Desde" value={dateFrom} onChange={(v) => v && setDateFrom(v)} slotProps={{ textField: { size: 'small' } }} />
        <DatePicker label="Hasta" value={dateTo} onChange={(v) => v && setDateTo(v)} slotProps={{ textField: { size: 'small' } }} />
        <Button variant="contained" size="small" onClick={() => setApplied({ from: dateFrom, to: dateTo })}>Aplicar</Button>
      </Box>
      <Grid container spacing={2} sx={{ mb: 3 }}>
        <Grid size={{ xs: 12, sm: 6 }}><KpiCard label="Pacientes atendidos en el período" value={attendedTotal} /></Grid>
        <Grid size={{ xs: 12, sm: 6 }}><KpiCard label="Ausentismo (turnos cancelados)" value={`${absenteeism.absenteeism_rate}%`} /></Grid>
      </Grid>
      <Sec title="Pacientes atendidos por día" sx={{ mb: 3 }}>{trend.every((t) => t.count === 0) ? empty : <LineChartS labels={trend.map((t) => fmtDM(t.date))} values={trend.map((t) => t.count)} label="Pacientes atendidos" />}</Sec>
      <Grid container spacing={2} sx={{ mb: 3 }}>
        <Grid size={{ xs: 12, md: 6 }}><Sec title="Enfermedades por período">{diseases.length === 0 ? empty : <PieChartS data={diseases.map((d) => ({ label: d.label, value: d.count }))} />}</Sec></Grid>
        <Grid size={{ xs: 12, md: 6 }}><Sec title="Consumo de insumos por período">{supply.length === 0 ? empty : <BarChartS labels={supply.map((s) => s.type_product)} values={supply.map((s) => s.total_quantity)} />}</Sec></Grid>

// ---------- Agenda del médico (pages/doctor/AgendaPage.jsx) ----------
const TITULOS_RESUMEN = ['Paciente', 'Antecedentes en el sistema', 'Ultimos signos vitales', 'Últimos signos vitales', 'Seguimiento de enfermeria', 'Seguimiento de enfermería', 'Indicaciones registradas', 'Puntos a tener en cuenta'];
function ResumenFormateado({ text }) {
  return (
    <Box>
      {text.split('\n').map((linea, i) => {
        const limpia = linea.trim().replace(/^\*\*|\*\*$/g, '').replace(/^#+\s*/, '');
        if (!limpia) return <Box key={i} sx={{ height: 6 }} />;
        const esTitulo = TITULOS_RESUMEN.some((t) => limpia.toLowerCase().replace(':', '') === t.toLowerCase());
        const esItem = /^[-*•]\s+/.test(limpia);
        if (esTitulo) return <Typography key={i} variant="subtitle2" fontWeight={800} color="#0E4C82" sx={{ mt: 1.5, mb: 0.5 }}>{limpia.replace(':', '')}</Typography>;
        return <Typography key={i} variant="body2" color="#334155" sx={{ lineHeight: 1.7, pl: esItem ? 2 : 0 }}>{esItem ? `• ${limpia.replace(/^[-*•]\s+/, '')}` : limpia}</Typography>;
      })}
    </Box>
  );
}
const apStatusColor = (s) => (s === 'Reservado' ? 'info' : s === 'En espera' ? 'warning' : s === 'Atendido' ? 'success' : s === 'Cancelado' ? 'error' : 'default');
function StatusDialog({ target, onClose, onApply, error }) {
  const [newStatus, setNewStatus] = useState('');
  useEffect(() => { setNewStatus(''); }, [target]);
  const allowed = target ? VALID_STATUS_TRANSITIONS[target.status] || [] : [];
  return (
    <Dialog open={Boolean(target)} onClose={onClose} fullWidth maxWidth="xs">
      <DialogTitle>Cambiar estado del turno</DialogTitle>
      <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
        {error && <Alert severity="error">{error}</Alert>}
        {target && <Typography variant="body2" color="#5b7387">{target.patient_name} — {target.date ? formatDate(target.date) + ' ' : ''}{target.hour}<br />Estado actual: <strong>{target.status}</strong></Typography>}
        {allowed.length === 0 ? <Typography variant="body2" color="#5b7387">Este turno ya está en un estado final: no admite más cambios.</Typography> : (
          <TextField select label="Nuevo estado" value={newStatus} onChange={(e) => setNewStatus(e.target.value)}>{allowed.map((s) => <MenuItem key={s} value={s}>{s}</MenuItem>)}</TextField>)}
      </DialogContent>
      <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={onClose}>Cancelar</Button><Button variant="contained" disabled={!newStatus} onClick={() => onApply(target.id_medical_appointment, newStatus)}>Guardar</Button></DialogActions>
    </Dialog>
  );
}

  const lastSign = (pid) => api.db.signs.filter((s) => s.id_patient === pid).sort((a, b) => new Date(b.date_and_time) - new Date(a.date_and_time))[0] || null;

  );

function IndicacionesPage() {
  const api = useDb();

  const [editingRow, setEditingRow] = useState(null);

  const [deleteTarget, setDeleteTarget] = useState(null);
  const [historyTarget, setHistoryTarget] = useState(null);
  const patients = api.patients();
  const eligiblePatients = api.patientsByStatus();
  const sortedRows = [...api.db.indications].filter((r) => r.id_doctor === userId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const isEditable = (r) => minutesSince(r.created_at) < EDIT_WINDOW_MINUTES;
  const openCreateDialog = () => { setEditingRow(null); setF({ id_patient: '', indication: '', treatment: '' }); setErrors({}); setOpen(true); };
  const openEditDialog = (r) => { setEditingRow(r); setF({ id_patient: r.id_patient, indication: r.indication, treatment: r.treatment || '' }); setErrors({}); setOpen(true); };
  const onSubmit = (e) => {
    e.preventDefault(); const errs = {};
    if (!f.id_patient) errs.id_patient = 'Elegí un paciente';
    if (!f.indication.trim()) errs.indication = 'Ingresá la indicación';
    setErrors(errs); if (Object.keys(errs).length) return;
    api.update((n) => {
      if (editingRow) n.indications = n.indications.map((r) => (r.id_medical_indication === editingRow.id_medical_indication ? { ...r, indication: f.indication.trim(), treatment: f.treatment.trim() } : r));
      else { const id = ++n.seq.ind; const todayAp = n.appointments.find((a) => a.id_patient === Number(f.id_patient) && a.id_doctor === userId && a.date === todayStr() && a.status !== 'Cancelado'); n.indications = [...n.indications, { id_medical_indication: id, id_patient: Number(f.id_patient), id_doctor: userId, id_medical_appointment: todayAp?.id_medical_appointment || null, indication: f.indication.trim(), treatment: f.treatment.trim(), created_at: nowIso() }]; api.log(n, api.user(userId).username, 'CREAR', 'medical_indication', id, 'Registro creado en la tabla medical_indication'); }
    });

          <TableHead><TableRow>{['Paciente', 'DNI', 'Edad', 'Indicación', 'Tratamiento', 'Fecha'].map((h) => <TableCell key={h}>{h}</TableCell>)}<TableCell align="center">PDF</TableCell><TableCell align="right">Acciones</TableCell></TableRow></TableHead>
          <TableBody>
            {sortedRows.map((r) => { const editable = isEditable(r); const patient = api.user(r.id_patient); return (
              <TableRow key={r.id_medical_indication}>
                <TableCell sx={{ fontWeight: 600 }}>{api.name(r.id_patient)}</TableCell>
                <TableCell>{getPatientDni(patient)}</TableCell>
                <TableCell>{getPatientAge(patient?.date_of_birth) ?? '—'}</TableCell>
                <TableCell>{r.indication}</TableCell>
                <TableCell>{r.treatment || '—'}</TableCell>
                <TableCell sx={{ color: paletteRaw.gray, whiteSpace: 'nowrap' }}>{formatDateTime(r.created_at)}</TableCell>
                <TableCell align="center">
                  <Tooltip title="Ver historial del paciente"><IconButton size="small" onClick={() => setHistoryTarget(patient)}><HistoryIcon fontSize="small" sx={{ color: paletteRaw.azul }} /></IconButton></Tooltip>

      </Dialog>
      <IndicationsHistoryDialog open={!!historyTarget} onClose={() => setHistoryTarget(null)} patientId={historyTarget?.id_user} patientName={fullName(historyTarget)} patientDni={getPatientDni(historyTarget)} patientAge={getPatientAge(historyTarget?.date_of_birth)} />
    </Box>

  const applyStatus = (id, status) => { api.update((n) => { n.appointments = n.appointments.map((a) => (a.id_medical_appointment === id ? { ...a, status } : a)); api.log(n, api.user(userId).username, 'ACTUALIZAR', 'medical_appointment', id, `Registro actualizado en la tabla medical_appointment: status → ${status}`); }); setActionOk(`Turno marcado como "${status}".`); setStatusTarget(null); };

  const handleCreate = async () => {
    setCreateError('');
    if (!patientChecked) { setCreateError('Buscá el paciente por DNI antes de continuar.'); return; }
    if (!foundPatient && (!newPatient.first_name || !newPatient.last_name || !newPatient.email || !newPatient.date_of_birth)) { setCreateError('Completá nombre, apellido, email y fecha de nacimiento del paciente nuevo.'); return; }
    if (!doctorId || !appointmentDate || !hour) { setCreateError('Elegí profesional, fecha y horario.'); return; }

      let pid = foundPatient?.id_user;
      if (!pid) { pid = ++n.seq.user; n.users = [...n.users, { id_user: pid, rol: 'Patient', is_active: true, photo: null, country: 'Argentina', address: '', emergency_contact: '', gender: '', username: dni.trim(), password: dni.trim(), dni: dni.trim(), ...newPatient, health_plan_status: !!newPatient.health_plan_name }]; api.log(n, api.user(userId).username, 'CREAR', 'patients', pid, 'Registro creado en la tabla patients'); }

      <Card sx={{ p: 2 }}>
        <Table size="small">
          <TableHead><TableRow><Th>Fecha</Th><Th>Hora</Th><Th>Paciente</Th><Th>Profesional</Th><Th>Motivo</Th><Th>Estado</Th><Th align="right">Acciones</Th></TableRow></TableHead>
          <TableBody>
            {visibleRows.map((ap) => { const final = ap.status === 'Atendido' || ap.status === 'Cancelado'; return (
              <TableRow key={ap.id_medical_appointment}>
                <TableCell>{formatDate(ap.date)}</TableCell><TableCell>{ap.hour}</TableCell><TableCell>{ap.patient_name}</TableCell><TableCell>{ap.doctor_name}</TableCell><TableCell>{ap.reason || '—'}</TableCell>
                <TableCell><Box sx={{ display: 'flex', gap: 0.5, flexWrap: 'wrap' }}><Chip size="small" label={ap.status} color={apStatusColor(ap.status)} />{ap.is_overbooking && <Chip size="small" label="Sobreturno" color="secondary" variant="outlined" />}{ap.confirmed && <Chip size="small" label="Confirmado" variant="outlined" />}</Box></TableCell>
                <TableCell align="right">

                  <Tooltip title="Cancelar turno"><span><IconButton size="small" color="error" onClick={() => setCancelTarget(ap)} disabled={final}><EventBusyIcon fontSize="small" /></IconButton></span></Tooltip>
                </TableCell>
              </TableRow>); })}

        </Table>

        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setCancelTarget(null)}>Volver</Button><Button color="error" variant="contained" onClick={handleCancel}>Cancelar turno</Button></DialogActions>
      </Dialog>
      <Dialog open={createOpen} onClose={() => setCreateOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>{isOverbooking ? 'Nuevo sobreturno' : 'Nuevo turno'}</DialogTitle>
        <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {createError && <Alert severity="error">{createError}</Alert>}
          <Typography variant="body2" fontWeight={700} color="#0E4C82">1. Paciente</Typography>
          <Box sx={{ display: 'flex', gap: 1 }}><TextField size="small" label="DNI" value={dni} onChange={(e) => { setDni(e.target.value); setPatientChecked(false); setFoundPatient(null); }} sx={{ flex: 1 }} /><Button variant="outlined" onClick={handleSearchPatient}>Buscar</Button></Box>
          {patientChecked && foundPatient && <Alert severity="success">{foundPatient.first_name} {foundPatient.last_name}{foundPatient.health_plan_name ? ` — ${foundPatient.health_plan_name}` : ''}</Alert>}
          {patientChecked && !foundPatient && (<>
            <Alert severity="info">No hay ningún paciente con ese DNI. Completá los datos y se da de alta junto con el turno.</Alert>
            <Box sx={{ display: 'flex', gap: 2, flexWrap: 'wrap' }}>{np('first_name', 'Nombre')}{np('last_name', 'Apellido')}{np('email', 'Email', { type: 'email' })}{np('date_of_birth', 'Fecha de nacimiento', { type: 'date', slotProps: { inputLabel: { shrink: true } } })}{np('phone_number', 'Teléfono')}{np('health_plan_name', 'Obra social')}</Box>
          </>)}
          <Divider />
          <Typography variant="body2" fontWeight={700} color="#0E4C82">2. Profesional</Typography>
          <TextField select size="small" label="Especialidad" value={specialtyId} onChange={(e) => { setSpecialtyId(e.target.value); setDoctorId(''); setAppointmentDate(''); setHour(''); }}>{SPECIALTIES.map((s) => <MenuItem key={s.id_speciality} value={s.id_speciality}>{s.name}</MenuItem>)}</TextField>
          <TextField select size="small" label="Profesional" value={doctorId} onChange={(e) => { setDoctorId(e.target.value); setAppointmentDate(''); setHour(''); }} disabled={!specialtyId || doctors.length === 0} helperText={specialtyId && doctors.length === 0 ? 'No hay profesionales en esta especialidad.' : ''}>{doctors.map((d) => <MenuItem key={d.id_user} value={d.id_user}>{d.first_name} {d.last_name}</MenuItem>)}</TextField>
          <Divider />
          <Typography variant="body2" fontWeight={700} color="#0E4C82">3. Fecha y horario</Typography>
          <FormControlLabel control={<Checkbox checked={isOverbooking} onChange={(e) => { setIsOverbooking(e.target.checked); setHour(''); }} />} label="Es un sobreturno (urgencia): se agenda aunque el horario esté ocupado" />
          <TextField type="date" size="small" label="Fecha" value={appointmentDate} onChange={(e) => { setAppointmentDate(e.target.value); setHour(''); }} disabled={!doctorId} slotProps={{ inputLabel: { shrink: true }, htmlInput: { min: today } }} />
          {appointmentDate && freeSlotCount === 0 && grid.length > 0 && !isOverbooking && <Alert severity="warning">No quedan horarios libres ese día. Elegí otra fecha, o marcá sobreturno para asignar uno igual.</Alert>}
          {isOverbooking && takenSlots.length > 0 && <Alert severity="info">Horarios ya ocupados: {takenSlots.join(' · ')}. Como es un sobreturno, podés elegir uno de esos igual.</Alert>}
          <Box sx={{ display: 'flex', gap: 1, flexWrap: 'wrap' }}>
            {grid.map((slot) => { const isTaken = slot.status === 'taken'; const selectable = !isTaken || isOverbooking; return (
              <Tooltip key={slot.hour} title={isTaken ? (isOverbooking ? 'Ocupado — se agenda como sobreturno' : 'Ya reservado') : ''} disableHoverListener={!isTaken}><span>
                <Chip label={slot.hour} disabled={!selectable} onClick={selectable ? () => setHour(slot.hour) : undefined} color={hour === slot.hour ? 'primary' : isTaken ? 'warning' : 'default'} variant={hour === slot.hour ? 'filled' : 'outlined'} sx={{ fontWeight: 600, textDecoration: isTaken && !isOverbooking ? 'line-through' : 'none' }} />
              </span></Tooltip>); })}
          </Box>
          <TextField size="small" label="Motivo de la consulta (opcional)" value={reason} onChange={(e) => setReason(e.target.value)} />
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setCreateOpen(false)}>Cancelar</Button><Button variant="contained" onClick={handleCreate} disabled={saving}>{saving ? 'Guardando...' : 'Registrar turno'}</Button></DialogActions>
      </Dialog>
    </Box>
  );
}

// ---------- Noticias y novedades (pages/admin/AdminNoticiasPage.jsx) ----------
const NEWS_CATEGORIES = ['Prevención', 'Salud estacional', 'Enfermedades'];

    api.update((n) => { if (editing) n.news = n.news.map((x) => (x.id_news_and_prevention === editing.id_news_and_prevention ? { ...x, ...form, photo: photoPreview || null } : x)); else { const id = ++n.seq.news; n.news = [...n.news, { id_news_and_prevention: id, id_user: userId, ...form, photo: photoPreview || null, date: nowIso() }]; api.log(n, api.user(userId).username, 'CREAR', 'news_and_prevention', id, 'Registro creado en la tabla news_and_prevention'); } });
    setDialogOpen(false);
  };
  const handleDelete = () => { api.update((n) => { n.news = n.news.filter((x) => x.id_news_and_prevention !== deleteTarget.id_news_and_prevention); api.log(n, api.user(userId).username, 'ELIMINAR', 'news_and_prevention', deleteTarget.id_news_and_prevention, 'Registro eliminado en la tabla news_and_prevention'); }); setDeleteTarget(null); };
  return (

      <Card sx={{ p: 2 }}>
        <Table>
          <TableHead><TableRow><TableCell width={70}><b>Foto</b></TableCell><TableCell><b>Título</b></TableCell><TableCell><b>Categoría</b></TableCell><TableCell><b>Fecha</b></TableCell><TableCell align="right"><b>Acciones</b></TableCell></TableRow></TableHead>
          <TableBody>
            {news.map((item) => (
              <TableRow key={item.id_news_and_prevention}>
                <TableCell><Avatar variant="rounded" src={item.photo || undefined} sx={{ width: 48, height: 48, bgcolor: '#e2e8f0' }}><ImageIcon sx={{ color: '#94a3b8' }} /></Avatar></TableCell>
                <TableCell>{item.title}</TableCell><TableCell><Chip label={item.category} size="small" /></TableCell><TableCell>{formatDate(item.date)}</TableCell>
                <TableCell align="right"><IconButton size="small" onClick={() => openEdit(item)}><EditIcon fontSize="small" /></IconButton><IconButton size="small" color="error" onClick={() => setDeleteTarget(item)}><DeleteIcon fontSize="small" /></IconButton></TableCell>
              </TableRow>))}
            {news.length === 0 && <TableRow><TableCell colSpan={5}><Typography color="#5b7387" sx={{ py: 2 }}>No hay noticias cargadas.</Typography></TableCell></TableRow>}
          </TableBody>
        </Table>
      </Card>
      <Dialog open={dialogOpen} onClose={() => setDialogOpen(false)} fullWidth maxWidth="sm">
        <DialogTitle>{editing ? 'Editar noticia' : 'Nueva noticia'}</DialogTitle>

          {formError && <Alert severity="error">{formError}</Alert>}

            {photoPreview && <Box component="img" src={photoPreview} alt="Vista previa" sx={{ width: '100%', maxHeight: 200, objectFit: 'cover', borderRadius: 2, mb: 1, display: 'block' }} />}

              {photoPreview && <Button size="small" color="error" onClick={() => { setPhotoPreview(''); if (fileInputRef.current) fileInputRef.current.value = ''; }}>Quitar</Button>}

      </Dialog>

      </Dialog>
    </Box>
  );

const nombreTabla = (t) => TABLAS[t] || t;
const traducirDetalle = (detalle) => { if (!detalle) return '—'; let texto = detalle; Object.keys(TABLAS).sort((a, b) => b.length - a.length).forEach((t) => { texto = texto.replace(new RegExp(`\\b${t}\\b`, 'g'), TABLAS[t]); }); return texto.replace(/\ben la tabla\b/gi, 'en').replace(/\bDoctor\b/g, 'Médico'); };
const ACCIONES = { CREAR: 'Creación', ACTUALIZAR: 'Modificación', ELIMINAR_LOGICO: 'Baja', ELIMINAR: 'Eliminación', ACTIVAR: 'Reactivación', RESTAURAR: 'Reactivación', LOGIN: 'Inicio de sesión' };
const nombreAccion = (a) => ACCIONES[a] || a;
const actionColor = (action) => { const a = (action || '').toUpperCase(); if (/CREATE|CREAR|INSERT|ALTA/.test(a)) return 'success'; if (/DELETE|ELIMINAR|BAJA|CANCEL/.test(a)) return 'error'; if (/UPDATE|ACTUALIZAR|EDIT|MODIF/.test(a)) return 'warning'; if (/LOGIN|SESION/.test(a)) return 'info'; return 'default'; };

const PERFIL_EDITABLE = ['email', 'phone_number', 'address', 'emergency_contact', 'country', 'gender'];

const PERFIL_LABELS = { email: 'Email', phone_number: 'Teléfono', address: 'Dirección', emergency_contact: 'Contacto de emergencia', country: 'País', gender: 'Género', health_plan_name: 'Obra social', member_number: 'Nº de afiliado' };
function PerfilPage() {

  const [repeatPassword, setRepeatPassword] = useState('');

  const [passwordError, setPasswordError] = useState('');
  const fileInputRef = useRef(null);
  const name = fullName(profile);
  const handleSave = () => { api.update((n) => { n.users = n.users.map((u) => (u.id_user === userId ? { ...u, ...form, photo: photoPreview || null } : u)); }); refresh(); setSaveOk('Perfil actualizado.'); };
  const loadProfile = () => { setForm(Object.fromEntries(fields.map((k) => [k, profile[k] ?? '']))); setPhotoPreview(profile.photo || ''); };
  const handlePhotoChange = (e) => { const file = e.target.files?.[0]; if (!file) return; if (file.size > MAX_PHOTO_MB * 1024 * 1024) { setSaveError(`La imagen supera los ${MAX_PHOTO_MB} MB.`); return; } const r = new FileReader(); r.onload = () => setPhotoPreview(r.result); r.readAsDataURL(file); };
  const handleChangePassword = () => {
    setPasswordError('');
    if (currentPassword !== profile.password) { setPasswordError('La contraseña actual no es correcta.'); return; }
    if (newPassword.length < 6) { setPasswordError('La nueva contraseña debe tener al menos 6 caracteres.'); return; }
    if (newPassword !== repeatPassword) { setPasswordError('Las contraseñas no coinciden.'); return; }
    api.update((n) => { n.users = n.users.map((u) => (u.id_user === userId ? { ...u, password: newPassword } : u)); });
    setPasswordOpen(false); setSaveOk('Contraseña actualizada.');

  const RO = ({ label, value, mt }) => <><Typography variant="caption" color="#5b7387" display="block" sx={{ mt }}>{label}</Typography><Typography variant="body2" fontWeight={600} sx={{ mb: 1 }}>{value}</Typography></>;
  return (
    <Box sx={{ maxWidth: 900 }}>
      <Box sx={{ mb: 3 }}><Typography variant="h5" fontWeight={800} color="#0E4C82">Mi perfil</Typography><Typography variant="body2" color="#5b7387">Tus datos personales y de contacto</Typography></Box>
      {saveError && <Alert severity="error" sx={{ mb: 2 }} onClose={() => setSaveError('')}>{saveError}</Alert>}
      {saveOk && <Alert severity="success" sx={{ mb: 2 }} onClose={() => setSaveOk('')}>{saveOk}</Alert>}
      <Grid container spacing={2}>
        <Grid size={{ xs: 12, md: 4 }}>
          <Card sx={{ p: 3, textAlign: 'center' }}>
            <Avatar src={photoPreview || undefined} sx={{ width: 120, height: 120, mx: 'auto', mb: 2, bgcolor: '#0E4C82', fontSize: 44, fontWeight: 700 }}>{name.charAt(0).toUpperCase()}</Avatar>
            <Typography fontWeight={800} color="#0E4C82">{name}</Typography>
            <Chip size="small" label={ROLE_LABELS[profile.rol] || profile.rol} sx={{ mt: 0.5, mb: 2 }} />
            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <Button variant="outlined" size="small" startIcon={<PhotoCameraIcon />} onClick={() => fileInputRef.current?.click()}>{photoPreview ? 'Cambiar foto' : 'Subir foto'}</Button>
              {photoPreview && <Button size="small" color="error" onClick={() => setPhotoPreview('')}>Quitar foto</Button>}
              <Typography variant="caption" color="#5b7387">JPG, PNG, GIF o WEBP. Hasta {MAX_PHOTO_MB} MB.</Typography>
            </Box>
            <input ref={fileInputRef} type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden onChange={handlePhotoChange} />
            <Divider sx={{ my: 2 }} />
            <Box sx={{ textAlign: 'left' }}>
              <RO label="Usuario" value={profile.username} /><RO label="DNI" value={profile.dni} /><RO label="Fecha de nacimiento" value={formatDate(profile.date_of_birth)} />
              {profile.medical_license && <RO label="Matrícula" value={profile.medical_license} mt={1} />}
              {profile.license_number && <RO label="Matrícula" value={profile.license_number} mt={1} />}
            </Box>
          </Card>
        </Grid>
        <Grid size={{ xs: 12, md: 8 }}>
          <Card sx={{ p: 3 }}>
            <Typography fontWeight={700} color="#0E4C82" sx={{ mb: 2 }}>Datos de contacto</Typography>
            <Grid container spacing={2}>{fields.map((field) => <Grid key={field} size={{ xs: 12, sm: 6 }}><TextField fullWidth size="small" label={PERFIL_LABELS[field] || field} value={form[field] ?? ''} onChange={(e) => setForm({ ...form, [field]: e.target.value })} /></Grid>)}</Grid>
            <Box sx={{ mt: 3, display: 'flex', gap: 1, flexWrap: 'wrap' }}>
              <Button variant="contained" onClick={handleSave}>Guardar cambios</Button>
              <Button variant="outlined" onClick={loadProfile}>Descartar</Button>
              <Box sx={{ flexGrow: 1 }} />
              <Button variant="text" startIcon={<LockResetIcon />} onClick={() => { setCurrentPassword(''); setNewPassword(''); setRepeatPassword(''); setPasswordError(''); setPasswordOpen(true); }}>Cambiar contraseña</Button>
            </Box>
            <Typography variant="caption" color="#5b7387" sx={{ mt: 2, display: 'block' }}>El usuario, el DNI y la matrícula no se editan desde acá: si hay un error en esos datos, pedile la corrección a un administrativo.</Typography>
          </Card>
        </Grid>
      </Grid>
      <Dialog open={passwordOpen} onClose={() => setPasswordOpen(false)} fullWidth maxWidth="xs">
        <DialogTitle>Cambiar contraseña</DialogTitle>
        <DialogContent sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {passwordError && <Alert severity="error">{passwordError}</Alert>}
          <TextField type={show.c ? 'text' : 'password'} label="Contraseña actual" size="small" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} slotProps={eye('c')} sx={{ mt: 1 }} />
          <TextField type={show.n ? 'text' : 'password'} label="Nueva contraseña" size="small" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} helperText="Mínimo 6 caracteres" slotProps={eye('n')} />
          <TextField type={show.r ? 'text' : 'password'} label="Repetir nueva contraseña" size="small" value={repeatPassword} onChange={(e) => setRepeatPassword(e.target.value)} slotProps={eye('r')} />
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}><Button onClick={() => setPasswordOpen(false)}>Cancelar</Button><Button variant="contained" onClick={handleChangePassword}>Cambiar</Button></DialogActions>
      </Dialog>
    </Box>
  );
}


// ---------- Router + sesión (AuthContext + App.jsx) ----------
const ROLE_ROUTES = {
  Nurse: ['/signos', '/seguimiento', '/stock', '/guardia', '/estadisticas'],
  Doctor: ['/agenda', '/indicaciones', '/historia-clinica'],
  Patient: ['/sacar-turno', '/mis-turnos'],
  Administrative: ['/admin/turnos', '/admin/noticias'],
  Administrator: ['/admin/turnos', '/admin/noticias', '/admin/usuarios', '/admin/stock', '/admin/historia-clinica', '/admin/guardia'],
  Superadministrador: ['/admin/turnos', '/admin/noticias', '/admin/usuarios', '/admin/stock', '/admin/historia-clinica', '/admin/guardia', '/admin/bitacora'],
};
const PROTECTED = ['/signos', '/seguimiento', '/stock', '/guardia', '/estadisticas', '/agenda', '/indicaciones', '/historia-clinica', '/sacar-turno', '/mis-turnos', '/admin', '/perfil', '/inicio'];
const PUBLIC_ONLY = ['/', '/register', '/recuperar-cuenta'];

function parseHash() {
  const raw = (typeof window !== 'undefined' ? window.location.hash : '').replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const query = {};
  if (qs) qs.split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k) query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { path: path || '/', query };
}

function App() {
  const [db, setDb] = useState(() => buildInitialDb());
  const api = useMemo(() => makeApi(db, setDb), [db]);
  const [session, setSession] = useState(() => (typeof window !== 'undefined' && window.__INITIAL?.session) || null);
  const [loc, setLoc] = useState(() => (typeof window !== 'undefined' && window.__INITIAL?.path ? { path: window.__INITIAL.path, query: {} } : parseHash()));

  useEffect(() => {
    const onHash = () => setLoc(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const navigate = useCallback((to) => {
    if (typeof window !== 'undefined' && window.location.hash !== '#' + to) window.location.hash = to;
    const [path, qs] = to.split('?'); const query = {}; if (qs) qs.split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k) query[k] = decodeURIComponent(v || ''); });
    setLoc({ path, query });
  }, []);

  const sessionUser = session ? db.users.find((u) => u.id_user === session.userId) : null;
  const auth = useMemo(() => ({
    isAuthenticated: Boolean(session), rol: session?.rol, userId: session?.userId,
    nombre: sessionUser ? fullName(sessionUser) : '', foto: sessionUser?.photo || null,
    login: (username, password) => {
      const u = db.users.find((x) => x.username === username.trim());
      if (!u || u.password !== password) throw new Error('Usuario o contraseña incorrectos');
      if (u.is_active === false) throw new Error('La cuenta está dada de baja. Comunicate con la clínica.');
      setDb((prev) => { const n = { ...prev, seq: { ...prev.seq } }; n.bitacora = [{ id_bitacora: ++n.seq.bit, timestamp: nowIso(), username: u.username, action: 'LOGIN', table_name: 'users', record_id: u.id_user, details: `Inicio de sesión del usuario ${u.username}` }, ...n.bitacora]; return n; });
      setSession({ rol: u.rol, userId: u.id_user });
      return { rol: u.rol };
    },
    logout: () => setSession(null),
    refresh: () => setSession((s) => ({ ...s })),
  }), [session, sessionUser, db.users]);

  // Guards de ruta (PublicOnlyRoute / ProtectedRoute / *Route por rol)
  const { path } = loc;
  let target = null;
  if (session && PUBLIC_ONLY.includes(path)) target = roleHome(session.rol);
  else if (!session && PROTECTED.some((p) => path === p || path.startsWith(p + '/'))) target = '/';
  else if (session && path !== '/perfil' && path !== '/inicio' && PROTECTED.some((p) => path === p || path.startsWith(p + '/')) && !(ROLE_ROUTES[session.rol] || []).some((p) => path === p || path.startsWith(p + '/'))) target = roleHome(session.rol);
  useEffect(() => { if (target) navigate(target); }, [target, navigate]);

  const params = {};
  const newsMatch = path.match(/^\/noticias\/(\d+)$/);
  if (newsMatch) params.id = newsMatch[1];

  let page;
  if (target) page = null;
  else if (path === '/') page = <LoginPage />;
  else if (path === '/register') page = <RegisterPage />;
  else if (path === '/recuperar-cuenta') page = <RecuperarCuentaPage />;
  else if (path === '/turno-email') page = <TurnoEmailPage />;
  else if (path === '/turnos') page = <NewsShell><SacarTurnoPublicoPage /></NewsShell>;
  else if (path === '/noticias') page = <NewsShell><NewsAndPrevention /></NewsShell>;
  else if (newsMatch) page = <NewsShell><NewsDetail /></NewsShell>;
  else {
    const inner = {
      '/signos': <SignosPage />, '/seguimiento': <SeguimientoPage />, '/stock': <StockPage />, '/guardia': <GuardiaPage />, '/estadisticas': <EstadisticasPage />,
      '/agenda': <AgendaPage />, '/indicaciones': <IndicacionesPage />, '/historia-clinica': <HistoriaClinicaPage />,
      '/sacar-turno': <SacarTurnoPage />, '/mis-turnos': <MisTurnosPage />,
      '/admin/turnos': <AdminTurnosPage />, '/admin/noticias': <AdminNoticiasPage />, '/admin/usuarios': <AdminUsuariosPage />, '/admin/stock': <StockPage />, '/admin/historia-clinica': <HistoriaClinicaPage />, '/admin/guardia': <GuardiaPage />, '/admin/bitacora': <BitacoraPage />,
      '/perfil': <PerfilPage key={session?.userId} />, '/inicio': <HomePlaceholderPage />,
    }[path];
    page = inner ? <AuthShell>{inner}</AuthShell> : null;
    if (!inner) { page = <Box sx={{ p: 4 }}><Typography color={paletteRaw.gray}>Redirigiendo…</Typography></Box>; }
  }

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <DbCtx.Provider value={api}>
        <AuthCtx.Provider value={auth}>
          <RouterCtx.Provider value={{ path, query: loc.query, params, navigate }}>
            <NotFound path={path} />
            {page}
            <HelpAssistant />
          </RouterCtx.Provider>
        </AuthCtx.Provider>
      </DbCtx.Provider>
    </ThemeProvider>
  );
}
function NotFound({ path }) {
  const navigate = useNavigate();
  const known = ['/', '/register', '/recuperar-cuenta', '/turno-email', '/turnos', '/noticias', '/perfil', '/inicio', ...Object.values(ROLE_ROUTES).flat()];
  const ok = known.includes(path) || /^\/noticias\/\d+$/.test(path);
  useEffect(() => { if (!ok) navigate('/'); }, [ok, navigate]);
  return null;
}

if (typeof document !== 'undefined') {
  const loader = document.getElementById('loader'); if (loader) loader.remove();
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}

</script>
